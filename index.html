<script>

/* =========================================================
   LABGRAM V5
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://ualumobbhukgmjbznhea.supabase.co';

const SUPABASE_KEY =
'sb_publishable_Rq7Jp7tlZO5ugDORHcCebQ_NZJnVXrZ';

const {createClient}=supabase;

const sb=createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   GLOBAL STATE
========================================================= */

let me=null;
let route='login';
let param=null;
let postFile=null;
let avatarFile=null;


/* =========================================================
   CONSTANTS
========================================================= */

const OWNER_ID =
'2bd4d881-1a16-4726-a3dc-892befc6a934';

const specialties=[
 'General',
 'Histopathology',
 'Microbiology',
 'Hematology',
 'Cytology',
 'Clinical Chemistry',
 'Laboratory Quality'
];


/* =========================================================
   HELPERS
========================================================= */

const esc=v=>
 String(v??'')
 .replaceAll('&','&amp;')
 .replaceAll('<','&lt;')
 .replaceAll('>','&gt;')
 .replaceAll('"','&quot;')
 .replaceAll("'","&#039;");


const ago=t=>{

 let s=Math.floor(
  (Date.now()-new Date(t))/1000
 );

 if(s<60)return'الآن';

 if(s<3600)
  return Math.floor(s/60)+' د';

 if(s<86400)
  return Math.floor(s/3600)+' س';

 return Math.floor(s/86400)+' يوم';
};


function toast(x){

 let e=document.getElementById('toast');

 e.textContent=x;

 e.classList.remove('hidden');

 clearTimeout(window.tt);

 window.tt=setTimeout(
  ()=>e.classList.add('hidden'),
  2500
 );
}


function go(r,p=null){

 route=r;
 param=p;

 postFile=null;
 avatarFile=null;

 render();
}


function initials(u){

 let n =
  u?.display_name ||
  u?.username ||
  'U';

 return esc(
  n.trim().slice(0,1).toUpperCase()
 );
}


function avatar(u,big=false){

 return `
 <div class="${big?'bigavatar':'avatar'}">

 ${
  u?.avatar_url
  ?
  `<img src="${esc(u.avatar_url)}" alt="">`
  :
  initials(u)
 }

 </div>
 `;
}


/* =========================================================
   LOAD CURRENT USER
========================================================= */

async function loadMe(){

 try{

  const {
   data:{user},
   error:userError
  }=await sb.auth.getUser();


  if(userError){

   console.error(
    'AUTH ERROR:',
    userError
   );

   me=null;

   return false;
  }


  if(!user){

   me=null;

   return false;
  }


  console.log(
   'AUTH USER:',
   user.id,
   user.email
  );


  let {
   data,
   error
  }=await sb
   .from('profiles')
   .select('*')
   .eq('id',user.id)
   .maybeSingle();


  if(error){

   console.error(
    'PROFILE ERROR:',
    error
   );

   me=null;

   return false;
  }


  /*
   Profile doesn't exist.
   Create it.
  */

  if(!data){

   const username =
    user.user_metadata?.username ||
    user.email?.split('@')[0] ||
    'user_'+
    user.id.substring(0,8);


   const display_name =
    user.user_metadata?.display_name ||
    user.user_metadata?.full_name ||
    username;


   const {
    data:newProfile,
    error:createError
   }=await sb
    .from('profiles')
    .insert({

     id:user.id,

     username:username,

     display_name:display_name,

     full_name:display_name,

     bio:user.user_metadata?.bio || '',

     specialty:
      user.user_metadata?.specialty ||
      'General',

     avatar_url:null,

     verified:
      user.id===OWNER_ID,

     blocked:false,

     role:
      user.id===OWNER_ID
       ? 'owner'
       : 'user'

    })
    .select()
    .single();


   if(createError){

    console.error(
     'CREATE PROFILE ERROR:',
     createError
    );

    me=null;

    return false;
   }


   data=newProfile;
  }


  /*
   Owner is always owner
   according to fixed Owner UUID.
  */

  if(user.id===OWNER_ID){

   if(
    data.role!=='owner' ||
    data.username!=='mamons'
   ){

    const {data:ownerProfile,error:ownerError}
     =await sb
      .from('profiles')
      .update({

       username:'mamons',

       display_name:'Mamon Alsaoudi',

       full_name:'Mamon Alsaoudi',

       role:'owner',

       verified:true,

       blocked:false,

       updated_at:new Date().toISOString()

      })
      .eq('id',user.id)
      .select()
      .single();


    if(!ownerError && ownerProfile)
     data=ownerProfile;
   }
  }


  if(data.blocked){

   await sb.auth.signOut();

   alert(
    'تم حظر هذا الحساب.'
   );

   me=null;

   return false;
  }


  me=data;


  console.log(
   'LABGRAM PROFILE:',
   me
  );


  return true;


 }catch(e){

  console.error(
   'LOAD ME FAILED:',
   e
  );

  me=null;

  return false;
 }
}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

 try{

  const {
   data:{session}
  }=await sb.auth.getSession();


  if(session){

   const ok=await loadMe();

   route=ok?'feed':'login';

  }else{

   route='login';

  }


  render();


  sb.auth.onAuthStateChange(
   async(event,session)=>{

    console.log(
     'AUTH EVENT:',
     event
    );


    if(session){

     /*
      Small delay prevents
      auth state race conditions.
     */

     setTimeout(
      async()=>{

       const ok=
        await loadMe();

       route=
        ok
         ? 'feed'
         : 'login';

       render();

      },
      100
     );

    }else{

     me=null;

     route='login';

     render();

    }

   }
  );


 }catch(e){

  console.error(
   'BOOT ERROR:',
   e
  );

  me=null;

  route='login';

  render();
 }
}

 let a=

    <span class="hide-mobile">

 a.innerHTML=`

  <button

   👤 ${esc(me.username)}

  </button>

  <button
   class="btn secondary"

   خروج

  </button>

 `;


 b.classList.remove('hidden');


 b.innerHTML=`

 <div class="bottomin">

  <button onclick="go('feed')">
   🏠
   <small>الرئيسية</small>
  </button>

  <button onclick="go('search')">
   🔎
   <small>بحث</small>
  </button>

  <button onclick="go('create')">
   ➕
   <small>نشر</small>
  </button>

  <button onclick="go('messages')">
   💬
   <small>رسائل</small>
  </button>

  <button onclick="go('notifications')">
   🔔
   <small>تنبيهات</small>
  </button>

 </div>

 `;
}


/* =========================================================
   LOGIN
========================================================= */

function loginPage(){

 document.getElementById('app').innerHTML=`

 <section class="card auth">

  <div class="authlogo">
   Lab<span>Gram</span>
  </div>

  <p class="sub">
   مجتمع المختبرات والمهنيين الصحيين
  </p>

  <div class="field">

    البريد الإلكتروني
   </label>

   <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="name@example.com">

  </div>


  <div class="field">

   </label>

   <input
    id="pass"

    autocomplete="current-password"

  </div>


  <div id="err" class="error"></div>


  <button
   id="loginBtn"
   class="btn full"
   onclick="login()">

   تسجيل الدخول

  </button>


  <div
   style="text-align:center;margin-top:17px"
   class="muted">

   ليس لديك حساب؟

   <span
    class="link"
    onclick="go('register')">

    إنشاء حساب

   </span>

  </div>


  <div
   style="
    margin-top:20px;
    padding:11px;
    background:#f8fafc;
    border-radius:9px;
    font-size:12px
   "
   class="muted">

   الدخول محمي بواسطة Supabase Auth.

  </div>

 </section>

 `;
}


async function login(){

 const email=
  document
   .getElementById('email')
   .value
   .trim();


 const password=
  document
   .getElementById('pass')
   .value;


 const err=
  document.getElementById('err');


 const btn=
  document.getElementById('loginBtn');


 if(!email||!password){

  err.textContent=
   'أدخل البريد الإلكتروني وكلمة المرور.';

  return;
 }


 btn.disabled=true;

 btn.textContent=
  'جاري الدخول...';


 err.textContent='';


 try{

  const {
   data,
   error
  }=await sb.auth.signInWithPassword({

   email,
   password

  });


  if(error)
   throw error;


  console.log(
   'LOGIN SESSION:',
   data.session
  );


  if(!data.session){

   throw new Error(
    'تم تسجيل الدخول ولكن لم يتم إنشاء جلسة.'
   );
  }


  const ok=
   await loadMe();


  if(!ok){

   throw new Error(
    'تم تسجيل الدخول لكن تعذر تحميل ملف المستخدم من profiles.'
   );
  }


  toast(
   'تم تسجيل الدخول بنجاح 👋'
  );


  route='feed';

  render();


 }catch(e){

  console.error(
   'LOGIN FAILED:',
   e
  );

  err.textContent=
   e.message ||
   'حدث خطأ أثناء تسجيل الدخول.';


 }finally{

  btn.disabled=false;

  btn.textContent=
   'تسجيل الدخول';
 }
}

========================================================= */

async function uploadImage(file){

 if(!file)
  throw new Error(
   'لم يتم اختيار صورة.'
  );


 const ext=
  (
   file.name
   .split('.')
   .pop()||
   'jpg'
  )
  .toLowerCase()
  .replace(
   /[^a-z0-9]/g,
   ''
  );


 const path=
  `${me.id}/${crypto.randomUUID()}.${ext||'jpg'}`;


 const {
  error
 }=await sb
  .storage
  .from('post-images')
  .upload(
   path,
   file,
   {
    cacheControl:'3600',
    upsert:false,
    contentType:file.type
   }
  );


 if(error)
  throw error;


 return sb
  .storage
  .from('post-images')
  .getPublicUrl(path)
  .data
  .publicUrl;
}

/* =========================================================

async function getConv(other){

 const {
  data:mineMembers
 }=await sb
  .from('conversation_members')
  .select(
   'conversation_id'
  )
  .eq(
   'user_id',
   me.id
  );


 const ids=
  (mineMembers||[])
  .map(
   x=>x.conversation_id
  );


 if(!ids.length)
  return null;


 const {
  data:members
 }=await sb
  .from('conversation_members')
  .select(
   'conversation_id'
  )
  .in(
   'conversation_id',
   ids
  )
  .eq(
   'user_id',
   other
  );


 const cid=
  members?.[0]?.conversation_id;


 if(!cid)
  return null;


 const {
  data:c
 }=await sb
  .from('conversations')
  .select('*')
  .eq(
   'id',
   cid
  )
  .maybeSingle();


 return c;
}


async function startChat(other){

 let c=
  await getConv(other);


 if(!c){

  const {
   data:n,
   error
  }=await sb
   .from('conversations')
   .insert({})
   .select()
   .single();


  if(error){

   toast(error.message);

   return;
  }


  c=n;


  const {
   error:e
  }=await sb
   .from('conversation_members')
   .insert([

    {
     conversation_id:c.id,
     user_id:me.id
    },

    {
     conversation_id:c.id,
     user_id:other
    }

   ]);


  if(e){

   toast(e.message);

   'app'
  ).innerHTML=`

    <br><br>

  `;

 }


 const {
  data:cs,
  error
 }=await sb
  .from('conversations')

   id,
   created_at,
   conversation_members(
    user_id,
    profiles(
     username,
     display_name,
     avatar_url
    )
   ),
   messages(
    text,
    created_at,
    sender_id
   )

  );


 if(error){

 }


 document.getElementById(

 ).innerHTML=`

 </h2>

     ?.find(
      x=>x.user_id!==me.id
     )

    (c.messages||[])
    .sort(
     (a,b)=>
      new Date(b.created_at)-
      new Date(a.created_at)
    )[0];


   return `

    <div
     class="dm"
     onclick="go('chat',${c.id})">

     ${avatar(o)}

     <div class="grow">

      <div class="user">
       ${esc(o?.username||'User')}
      </div>

      <div class="meta">

      </div>

     </div>

     <div class="meta">
      ${l?ago(l.created_at):''}
     </div>

    </div>

   `;

  }).join('')}

 </section>

 `;
}


/* =========================================================
   CHAT
========================================================= */

async function chatPage(id){

 const {
  data:c,
  error
 }=await sb
  .from('conversations')
  .select(`
   id,
   conversation_members(
    user_id,
    profiles(
     id,
     username,
     display_name,
     avatar_url,
     specialty
    )
   ),
   messages(
    id,
    sender_id,
    text,
    created_at
   )
  `)
  .eq(
   'id',
   id
  )
  .single();


 if(error||!c){

  go('messages');

  return;
 }


 const o=
  c.conversation_members
   ?.find(
    x=>x.user_id!==me.id
   )
   ?.profiles;


 const msgs=
  (c.messages||[])
  .sort(
   (a,b)=>
    new Date(a.created_at)-
    new Date(b.created_at)
  );


 document.getElementById(
  'app'
 ).innerHTML=`

 <section class="card chat">

  <div class="chathead">

   <button
    class="btn secondary"
    onclick="go('messages')">

    ←

   </button>


   ${avatar(o)}


   <div>

    <div class="user">
     ${esc(o?.username||'User')}
    </div>

    <div class="meta">
     ${esc(o?.specialty||'')}
    </div>

   </div>

  </div>


  <div
   class="chatbody"
   id="chatbody">

   ${
    msgs.length
    ?
    msgs.map(
     m=>`

     <div
      class="msg ${
       m.sender_id===me.id
       ?
       'mine'
       :
       'theirs'
      }">

      ${esc(m.text)}

      <span
       class="meta"
       style="
        display:block;
        opacity:.65
       ">

       ${new Date(
        m.created_at
       ).toLocaleTimeString(
        [],
        {
         hour:'2-digit',
         minute:'2-digit'
        }
       )}

      </span>

     </div>

     `
    ).join('')
    :
    `<div class="empty">
     ابدأ المحادثة 👋
    </div>`
   }

  </div>


  <form
   class="chatform"
   onsubmit="sendMsg(event,${id})">

   <input
    id="msg"
    maxlength="1000"
    placeholder="اكتب رسالة...">

   <button
    class="btn">

    إرسال

   </button>

  </form>

 </section>

 `;


 document.getElementById(
  'chatbody'
 ).scrollTop=999999;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMsg(e,id){

 e.preventDefault();


 const i=
  document.getElementById(
   'msg'
  );


 const text=
  i.value.trim();


 if(!text)
  return;


 const {
  error
 }=await sb
  .from('messages')
  .insert({

   conversation_id:id,

   sender_id:me.id,

   text

  });


 if(error)
  toast(error.message);

 else
  chatPage(id);
}

/* =========================================================

========================================================= */

async function loadAdminStats(){

 if(!me||me.role!=='owner')
  return;


 const [
  users,
  posts,
  reports,
  verified
 ]=await Promise.all([

  sb
   .from('profiles')
   .select('*',{
    count:'exact',
    head:true
   }),

  sb
   .from('posts')
   .select('*',{
    count:'exact',
    head:true
   }),

  sb
   .from('reports')
   .select('*',{
    count:'exact',
    head:true
   }),

  sb
   .from('profiles')
   .select('*',{
    count:'exact',
    head:true
   })
   .eq(
    'verified',
    true
   )

 ]);


 const u=
  document.getElementById(
   'usersCount'
  );

 const p=
  document.getElementById(
   'postsCount'
  );

 const r=
  document.getElementById(
   'reportsCount'
  );

 const v=
  document.getElementById(
   'verifiedCount'
  );


 if(u)
  u.textContent=
   users.count||0;

 if(p)
  p.textContent=
   posts.count||0;

 if(r)
  r.textContent=
   reports.count||0;

 if(v)
  v.textContent=
   verified.count||0;
}

========================================================= */

async function loadAdminUsers(){

 if(!me||me.role!=='owner')
  return;


 const box=
  document.getElementById(
   'adminUsers'
  );


 if(!box)
  return;


 const q=
  (
   document
    .getElementById('adminSearch')
    ?.value||
   ''
  )
  .trim();


 let query=
  sb
   .from('profiles')
   .select('*')
   .order(
    'created_at',
    {ascending:false}
   )
   .limit(50);


 if(q){

  query=
   query.or(
    `username.ilike.%${q}%,display_name.ilike.%${q}%,specialty.ilike.%${q}%`
   );

 }


 const {
  data,
  error
 }=await query;


 if(error){

  box.innerHTML=
   `<div class="empty">
    ${esc(error.message)}
   </div>`;

  return;
 }


 box.innerHTML=
  data?.length
  ?
  data.map(
   u=>`

   <div
    class="card result"
    style="box-shadow:none">

    ${avatar(u)}


    <div class="grow">

     <div class="user">

      ${esc(u.username)}

      ${
       u.verified
       ?
       '<span class="verify">✓</span>'
       :''
      }

     </div>


     <div class="meta">
      ${esc(u.display_name||'')}
     </div>


     <div class="meta">
      ${esc(u.specialty||'General')}
     </div>


     ${
      u.role==='owner'
      ?
      `<span class="ownerBadge">
       👑 Owner
      </span>`
      :''
     }

    </div>


    <div>

     ${
      u.id!==OWNER_ID
      ?
      `

      <button
       class="btn secondary"
       onclick="toggleVerify('${u.id}',${!!u.verified})">

       ${u.verified?'إلغاء التوثيق':'✓ توثيق'}

      </button>


      <button
       class="btn ${u.blocked?'success':'danger'}"
       onclick="toggleBlock('${u.id}',${!!u.blocked})">

       ${u.blocked?'فك الحظر':'حظر'}

      </button>

      `
      :
      '<b>👑</b>'
     }

    </div>

   </div>

  `
  ).join('')
  :
  '<div class="empty">لا يوجد مستخدمون.</div>';
}


/* =========================================================
   VERIFY USER
========================================================= */

async function toggleVerify(
 id,
 current
){

 if(!me||me.role!=='owner')
  return;


 const {
  error
 }=await sb
  .from('profiles')
  .update({

   verified:!current,

   updated_at:
    new Date().toISOString()

  })
  .eq(
   'id',
   id
  );


 if(error)
  toast(error.message);

 else{

  toast(
   current
    ?
    'تم إلغاء التوثيق'
    :
    'تم توثيق المستخدم ✓'
  );

  loadAdminUsers();

  loadAdminStats();
 }
}


/* =========================================================
   BLOCK USER
========================================================= */

async function toggleBlock(
 id,
 current
){

 if(!me||me.role!=='owner')
  return;


 if(
  !confirm(
   current
   ?
   'فك الحظر عن المستخدم؟'
   :
   'حظر المستخدم؟'
  )
 )
  return;


 const {
  error
 }=await sb
  .from('profiles')
  .update({

   blocked:!current,

   updated_at:
    new Date().toISOString()

  })
  .eq(
   'id',
   id
  );


 if(error)
  toast(error.message);

 else{

  toast(
   current
    ?
    'تم فك الحظر'
    :
    'تم حظر المستخدم'
  );

  loadAdminUsers();

 }
}
