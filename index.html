<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LabGram - مجتمع المختبرات</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
 --primary:#2563eb;
 --primary-light:#3b82f6;
 --bg:#f0f4f8;
 --white:#fff;
 --text:#1e293b;
 --gray:#64748b;
 --border:#e2e8f0;
 --shadow:0 2px 12px rgba(0,0,0,0.08);
 --radius:16px;
 --danger:#ef4444;
 --success:#22c55e;
}
body{
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
 direction:rtl;
 padding-bottom:80px;
}
.hidden{display:none!important}
.container{max-width:600px;margin:0 auto;padding:0 12px}

/* Header */
.header{
 background:var(--white);
 padding:12px 16px;
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:100;
}
.header-inner{
 max-width:600px;
 margin:0 auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{
 font-size:24px;
 font-weight:900;
 color:var(--primary);
 cursor:pointer;
}
.logo span{color:var(--primary-light)}

/* Buttons */
.btn{
 padding:8px 18px;
 border:none;
 border-radius:10px;
 font-weight:700;
 font-size:14px;
 cursor:pointer;
 transition:all .2s;
}
.btn-primary{background:var(--primary);color:var(--white)}
.btn-primary:hover{background:var(--primary-light)}
.btn-secondary{background:var(--bg);color:var(--text)}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-success{background:#dcfce7;color:#16a34a}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-full{width:100%;padding:12px}

/* Cards */
.card{
 background:var(--white);
 border-radius:var(--radius);
 box-shadow:var(--shadow);
 margin-bottom:14px;
 overflow:hidden;
}
.card-padding{padding:16px}

/* Auth */
.auth-box{max-width:400px;margin:40px auto;padding:32px}
.auth-box .logo{font-size:32px;text-align:center;display:block}
.auth-box .sub{text-align:center;color:var(--gray);margin:8px 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.field input,.field select,.field textarea{
 width:100%;
 padding:10px 14px;
 border:1.5px solid var(--border);
 border-radius:10px;
 font-size:14px;
 outline:none;
 transition:border .2s;
 background:var(--white);
}
.field input:focus,.field select:focus,.field textarea:focus{
 border-color:var(--primary)
}
.field textarea{min-height:80px;resize:vertical}

/* Posts */
.post-header{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px 14px;
}
.avatar{
 width:42px;
 height:42px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--primary),var(--primary-light));
 color:var(--white);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 font-size:18px;
 overflow:hidden;
 flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-sm{width:36px;height:36px;font-size:14px}
.avatar-lg{width:80px;height:80px;font-size:32px}

.post-user{font-weight:700;cursor:pointer}
.post-meta{font-size:12px;color:var(--gray)}
.post-category{
 background:#dbeafe;
 color:var(--primary);
 padding:2px 10px;
 border-radius:20px;
 font-size:11px;
 font-weight:700;
 margin-right:auto;
}
.post-img{width:100%;max-height:500px;object-fit:cover}
.post-body{padding:10px 14px 6px}
.post-actions{
 display:flex;
 gap:18px;
 padding:6px 14px 12px;
 border-bottom:1px solid var(--border);
}
.action-btn{
 background:none;
 border:none;
 font-size:20px;
 cursor:pointer;
 display:flex;
 align-items:center;
 gap:4px;
 color:var(--text);
}
.action-btn.liked{color:var(--danger)}
.action-btn span{font-size:13px;font-weight:600}

.post-caption{padding:6px 14px 4px;font-size:14px;line-height:1.6}
.post-caption b{margin-left:4px}

.comments-section{padding:10px 14px}
.comment{
 display:flex;
 gap:8px;
 margin-bottom:6px;
 font-size:13px;
}
.comment b{margin-left:4px;white-space:nowrap}
.comment-form{
 display:flex;
 gap:8px;
 margin-top:8px;
}
.comment-form input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:20px;font-size:13px;outline:none}
.comment-form button{
 background:none;
 border:none;
 color:var(--primary);
 font-weight:700;
 font-size:14px;
 cursor:pointer;
}

/* Profile */
.profile-header{display:flex;gap:16px;align-items:center;padding:16px}
.profile-info .name{font-size:20px;font-weight:900}
.profile-info .handle{color:var(--gray);font-size:13px}
.profile-stats{display:flex;gap:24px;margin:8px 0}
.profile-stats div{text-align:center}
.profile-stats div b{display:block;font-size:18px}
.profile-stats div span{font-size:11px;color:var(--gray)}
.profile-bio{color:var(--gray);font-size:14px;margin-top:4px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.post-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:3px;
 padding:0 14px 14px;
}
.post-grid img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 cursor:pointer;
 border-radius:4px;
}

/* Bottom Nav */
.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:var(--white);
 border-top:1px solid var(--border);
 padding:6px 0 env(safe-area-inset-bottom);
 z-index:100;
}
.bottom-nav-inner{
 max-width:600px;
 margin:0 auto;
 display:flex;
 justify-content:space-around;
}
.bottom-nav button{
 background:none;
 border:none;
 font-size:20px;
 cursor:pointer;
 color:var(--gray);
 padding:4px 8px;
}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav small{display:block;font-size:9px;font-weight:600}

/* Search */
.search-input{
 width:100%;
 padding:10px 16px;
 border:1.5px solid var(--border);
 border-radius:12px;
 font-size:14px;
 outline:none;
 margin-bottom:12px;
}
.search-result{
 display:flex;
 align-items:center;
 gap:12px;
 padding:10px 14px;
 cursor:pointer;
}
.search-result:hover{background:#f8fafc}

/* Chat */
.chat-box{min-height:70vh;display:flex;flex-direction:column}
.chat-header{
 display:flex;
 align-items:center;
 gap:10px;
 padding:12px;
 border-bottom:1px solid var(--border);
}
.chat-messages{
 flex:1;
 padding:14px;
 background:#f8fafc;
 overflow-y:auto;
 max-height:500px;
}
.msg{
 max-width:80%;
 padding:8px 14px;
 border-radius:16px;
 margin-bottom:6px;
 font-size:14px;
 line-height:1.5;
}
.msg.mine{
 background:var(--primary);
 color:var(--white);
 margin-right:auto;
 border-bottom-left-radius:4px;
}
.msg.theirs{
 background:var(--white);
 border:1px solid var(--border);
 margin-left:auto;
 border-bottom-right-radius:4px;
}
.chat-input{
 display:flex;
 gap:8px;
 padding:10px;
 border-top:1px solid var(--border);
 background:var(--white);
}
.chat-input input{flex:1;padding:8px 14px;border:1px solid var(--border);border-radius:20px;outline:none}

/* Toast */
.toast{
 position:fixed;
 bottom:80px;
 left:50%;
 transform:translateX(-50%);
 background:#1e293b;
 color:var(--white);
 padding:10px 20px;
 border-radius:12px;
 font-size:13px;
 z-index:200;
 box-shadow:0 4px 20px rgba(0,0,0,0.2);
 max-width:90%;
}

/* Empty */
.empty{
 text-align:center;
 padding:50px 20px;
 color:var(--gray);
}
.empty .icon{font-size:48px;display:block;margin-bottom:10px}

/* Badge */
.badge{
 display:inline-block;
 padding:2px 8px;
 border-radius:12px;
 font-size:10px;
 font-weight:700;
}
.badge-danger{background:#fee2e2;color:#dc2626}
.badge-success{background:#dcfce7;color:#16a34a}
.verified{
 display:inline-block;
 background:var(--primary);
 color:var(--white);
 border-radius:50%;
 width:18px;
 height:18px;
 font-size:10px;
 text-align:center;
 line-height:18px;
 margin-right:2px;
}

/* Admin */
.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.admin-stat{background:var(--bg);padding:14px;border-radius:12px;text-align:center}
.admin-stat b{display:block;font-size:22px;color:var(--primary)}
.admin-stat span{font-size:11px;color:var(--gray)}
.report-item{padding:12px 14px;border-bottom:1px solid var(--border)}
.report-item:last-child{border:none}

/* Utilities */
.flex{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.muted{color:var(--gray);font-size:12px}
.mt-8{margin-top:8px}
.mb-8{margin-bottom:8px}
.text-center{text-align:center}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
 <div class="header-inner">
  <div class="logo" onclick="go('feed')">Lab<span>Gram</span></div>
  <div id="headerActions"></div>
 </div>
</header>

<!-- Main -->
<main class="container" id="app"></main>

<!-- Bottom Nav -->
<nav class="bottom-nav hidden" id="bottomNav">
 <div class="bottom-nav-inner">
  <button onclick="go('feed')">🏠<small>الرئيسية</small></button>
  <button onclick="go('search')">🔍<small>بحث</small></button>
  <button onclick="go('create')">➕<small>نشر</small></button>
  <button onclick="go('messages')">💬<small>رسائل</small></button>
  <button onclick="go('notifications')">🔔<small>تنبيهات</small></button>
 </div>
</nav>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script>
// ============================================================
// LABGRAM - VERSION 7.0 (FULLY WORKING)
// ============================================================

const SUPABASE_URL = 'https://ualumobbhukgmjbznhea.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Rq7Jp7tlZO5ugDORHcCebQ_NZJnVXrZ';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;
let route = 'login';
let param = null;
let postFile = null;
let avatarFile = null;

// ============================================================
// HELPERS
// ============================================================

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function ago(t){
 const s = Math.floor((Date.now() - new Date(t)) / 1000);
 if(s<60) return 'الآن';
 if(s<3600) return Math.floor(s/60)+'د';
 if(s<86400) return Math.floor(s/3600)+'س';
 return Math.floor(s/86400)+'يوم';
}

function toast(msg){
 const el = document.getElementById('toast');
 el.textContent = msg;
 el.classList.remove('hidden');
 clearTimeout(window._toast);
 window._toast = setTimeout(()=>el.classList.add('hidden'),2500);
}

function go(r,p=null){
 route=r; param=p; postFile=null; avatarFile=null; render();
}

function getInitials(u){
 const n = u?.display_name || u?.full_name || u?.username || 'U';
 return n.trim().charAt(0).toUpperCase();
}

function getAvatar(u, size=''){
 const cls = size==='lg' ? 'avatar avatar-lg' : size==='sm' ? 'avatar avatar-sm' : 'avatar';
 if(u?.avatar_url) return `<div class="${cls}"><img src="${esc(u.avatar_url)}"></div>`;
 return `<div class="${cls}">${getInitials(u)}</div>`;
}

function isOwner(){ return me?.role === 'owner'; }
function isBlocked(u){ return u?.blocked === true; }

// ============================================================
// AUTH
// ============================================================

async function boot(){
 try {
  const { data:{session} } = await sb.auth.getSession();
  if(session){
   const ok = await loadMe();
   if(ok) route='feed';
   else route='login';
  } else route='login';
  render();
  sb.auth.onAuthStateChange(async (e,session)=>{
   if(session){
    const ok = await loadMe();
    if(ok){ route='feed'; render(); }
    else { me=null; route='login'; render(); }
   } else {
    me=null; route='login'; render();
   }
  });
 } catch(e){ console.error(e); }
}

async function loadMe(){
 try {
  const { data:{user} } = await sb.auth.getUser();
  if(!user) { me=null; return false; }
  const { data, error } = await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error){ console.error(error); return false; }
  if(!data){
   // Create profile
   const meta = user.user_metadata || {};
   const newProfile = {
    id: user.id,
    username: meta.username || user.email.split('@')[0],
    display_name: meta.display_name || meta.full_name || '',
    avatar_url: meta.avatar_url || null,
    specialty: meta.specialty || 'General',
    bio: meta.bio || '',
    role: 'user',
    blocked: false
   };
   const { data:created, error:insErr } = await sb.from('profiles').insert(newProfile).select().single();
   if(insErr){ console.error(insErr); return false; }
   me = created;
  } else {
   me = data;
  }
  if(me.blocked){ toast('حسابك محظور'); await sb.auth.signOut(); me=null; return false; }
  return true;
 } catch(e){ console.error(e); return false; }
}

async function login(){
 const email = document.getElementById('email').value.trim();
 const pass = document.getElementById('pass').value;
 const err = document.getElementById('err');
 err.textContent='';
 if(!email || !pass){ err.textContent='أدخل البريد وكلمة المرور'; return; }
 const { error } = await sb.auth.signInWithPassword({ email, password:pass });
 if(error){ err.textContent=error.message; return; }
 toast('مرحباً بك في LabGram!');
}

async function register(){
 const username = document.getElementById('username').value.trim();
 const display = document.getElementById('display').value.trim();
 const email = document.getElementById('email').value.trim();
 const pass = document.getElementById('pass').value;
 const err = document.getElementById('err');
 err.textContent='';
 if(username.length<3){ err.textContent='اسم المستخدم 3 أحرف على الأقل'; return; }
 if(!display){ err.textContent='أدخل اسمك'; return; }
 if(!email){ err.textContent='أدخل البريد'; return; }
 if(pass.length<6){ err.textContent='كلمة المرور 6 أحرف على الأقل'; return; }
 // Check username
 const { data:existing } = await sb.from('profiles').select('username').eq('username',username).maybeSingle();
 if(existing){ err.textContent='اسم المستخدم مستخدم'; return; }
 const { data, error } = await sb.auth.signUp({
  email,
  password:pass,
  options:{ data:{ username, display_name:display, specialty:'General', bio:'' } }
 });
 if(error){ err.textContent=error.message; return; }
 if(data.session){
  await loadMe();
  route='feed'; render();
  toast('تم إنشاء الحساب بنجاح!');
 } else {
  err.textContent='تم الإرسال. تحقق من بريدك للتأكيد.';
 }
}

async function logout(){
 await sb.auth.signOut();
 me=null; route='login'; render();
}

// ============================================================
// RENDER PAGES
// ============================================================

function render(){
 updateHeader();
 if(!me){
  if(route==='register') renderRegister();
  else renderLogin();
  document.getElementById('bottomNav').classList.add('hidden');
  return;
 }
 document.getElementById('bottomNav').classList.remove('hidden');
 switch(route){
  case 'feed': renderFeed(); break;
  case 'create': renderCreate(); break;
  case 'profile': renderProfile(param); break;
  case 'search': renderSearch(); break;
  case 'messages': renderMessages(); break;
  case 'chat': renderChat(param); break;
  case 'notifications': renderNotifications(); break;
  case 'post': renderPost(param); break;
  case 'admin': renderAdmin(); break;
  default: renderFeed();
 }
}

function updateHeader(){
 const el = document.getElementById('headerActions');
 if(!me){
  el.innerHTML = `<button class="btn btn-primary btn-sm" onclick="go('login')">دخول</button>`;
  return;
 }
 el.innerHTML = `
  <button class="btn btn-secondary btn-sm" onclick="go('profile','${me.id}')">👤</button>
  ${isOwner() ? `<button class="btn btn-danger btn-sm" onclick="go('admin')">⚙️</button>` : ''}
  <button class="btn btn-secondary btn-sm" onclick="logout()">🚪</button>
 `;
}

// ============================================================
// LOGIN & REGISTER
// ============================================================

function renderLogin(){
 document.getElementById('app').innerHTML = `
 <div class="card auth-box">
  <div class="logo">Lab<span>Gram</span></div>
  <p class="sub">مجتمع المختبرات والمهنيين الصحيين</p>
  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="email" type="email" placeholder="example@email.com">
  </div>
  <div class="field">
   <label>كلمة المرور</label>
   <input id="pass" type="password" placeholder="••••••••">
  </div>
  <div id="err" class="muted" style="color:var(--danger);min-height:20px"></div>
  <button class="btn btn-primary btn-full" onclick="login()">تسجيل الدخول</button>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray)">
   ليس لديك حساب؟ <span class="link" style="color:var(--primary);font-weight:700;cursor:pointer" onclick="go('register')">إنشاء حساب</span>
  </div>
 </div>
 `;
}

function renderRegister(){
 document.getElementById('app').innerHTML = `
 <div class="card auth-box">
  <div class="logo">Lab<span>Gram</span></div>
  <p class="sub">انضم إلى مجتمع المختبرات</p>
  <div class="field">
   <label>اسم المستخدم</label>
   <input id="username" placeholder="mam87_lab">
  </div>
  <div class="field">
   <label>الاسم الكامل</label>
   <input id="display" placeholder="اسمك الكامل">
  </div>
  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="email" type="email" placeholder="example@email.com">
  </div>
  <div class="field">
   <label>كلمة المرور</label>
   <input id="pass" type="password" placeholder="6 أحرف على الأقل">
  </div>
  <div id="err" class="muted" style="color:var(--danger);min-height:20px"></div>
  <button class="btn btn-primary btn-full" onclick="register()">إنشاء حساب</button>
  <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--gray)">
   لديك حساب؟ <span class="link" style="color:var(--primary);font-weight:700;cursor:pointer" onclick="go('login')">تسجيل الدخول</span>
  </div>
 </div>
 `;
}

// ============================================================
// FEED
// ============================================================

async function renderFeed(){
 document.getElementById('app').innerHTML = `
  <div style="padding:12px 0">
   <div class="card card-padding" style="background:linear-gradient(135deg,#dbeafe,#eff6ff)">
    <h2 style="font-size:18px">مرحباً ${esc(me?.display_name || me?.username || '')} 👋</h2>
    <p style="color:var(--gray);font-size:13px">شارك معرفتك مع مجتمع المختبرات</p>
    ${isOwner() ? '<div style="background:#dbeafe;padding:8px 12px;border-radius:8px;margin-top:8px;font-size:13px;font-weight:700;color:var(--primary)">👑 أنت مالك المنصة</div>' : ''}
   </div>
   <div id="feedPosts"><div class="empty"><span class="icon">⏳</span>جاري التحميل...</div></div>
  </div>
 `;
 loadPosts();
}

async function loadPosts(){
 const el = document.getElementById('feedPosts');
 if(!el) return;
 const { data, error } = await sb.from('posts')
  .select(`
   *,
   profiles(id,username,display_name,avatar_url,role,blocked),
   likes(user_id),
   comments(id,user_id,text,created_at,profiles(id,username,display_name,avatar_url,blocked))
  `)
  .order('created_at', { ascending: false });
 if(error){ el.innerHTML = `<div class="empty">⚠️ ${esc(error.message)}</div>`; return; }
 const posts = (data||[]).filter(p => isOwner() || !isBlocked(p.profiles));
 if(!posts.length){ el.innerHTML = `<div class="empty"><span class="icon">📭</span>لا توجد منشورات<br><small style="font-size:12px;color:var(--gray)">كن أول من ينشر!</small></div>`; return; }
 el.innerHTML = posts.map(p => postHTML(p)).join('');
}

function postHTML(p){
 const profile = p.profiles || {};
 const liked = (p.likes||[]).some(x => x.user_id === me.id);
 const isAdmin = isOwner();
 const canDelete = p.user_id === me.id || isAdmin;
 const username = profile.display_name || profile.username || 'مستخدم';
 return `
 <div class="card" id="post-${p.id}">
  <div class="post-header">
   ${getAvatar(profile)}
   <div class="grow">
    <div class="post-user" onclick="go('profile','${p.user_id}')">
     ${esc(username)}
     ${profile.role === 'owner' ? '<span class="verified">✓</span>' : ''}
     ${isBlocked(profile) ? '<span class="badge badge-danger">محظور</span>' : ''}
    </div>
    <div class="post-meta">${ago(p.created_at)} · ${esc(p.category||'General')}</div>
   </div>
   ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}',${p.user_id===me.id})">🗑️</button>` : ''}
  </div>
  ${p.image_url ? `<img class="post-img" src="${esc(p.image_url)}" alt="">` : ''}
  ${p.caption ? `<div class="post-caption"><b>${esc(username)}</b> ${esc(p.caption)}</div>` : ''}
  <div class="post-actions">
   <button class="action-btn ${liked?'liked':''}" onclick="toggleLike('${p.id}',${liked})">
    ${liked ? '❤️' : '🤍'} <span>${(p.likes||[]).length}</span>
   </button>
   <button class="action-btn" onclick="focusComment('${p.id}')">

function previewPostImage(e){
 const file = e.target.files[0];
 if(!file) return;
 if(file.size > 8*1024*1024){ toast('الصورة كبيرة جداً'); e.target.value=''; return; }
 postFile = file;
 const reader = new FileReader();
 reader.onload = ()=>{
  const el = document.getElementById('postPreview');
  el.src = reader.result;
  el.classList.remove('hidden');
 };
 reader.readAsDataURL(file);
}

async function publishPost(){

 try {
  toast('جاري الرفع...');
  const ext = postFile.name.split('.').pop() || 'jpg';
  const path = `${me.id}/${Date.now()}.${ext}`;
  const { error:upErr } = await sb.storage.from('post-images').upload(path, postFile);
  if(upErr) throw upErr;
  const { data: { publicUrl } } = sb.storage.from('post-images').getPublicUrl(path);
  const caption = document.getElementById('postCaption').value.trim();
  const category = document.getElementById('postCategory').value;
  const { error:insErr } = await sb.from('posts').insert({
   user_id: me.id, image_url: publicUrl, caption, category
  });
  if(insErr) throw insErr;
  toast('تم النشر! 🎉');
  go('feed');
 } catch(e){ toast('خطأ: '+e.message); }
}

async function sendMessage(e, id){
 e.preventDefault();
 const input = document.getElementById('chatInput');
 const text = input.value.trim();
 if(!text) return;
 const { error } = await sb.from('messages').insert({ conversation_id:id, sender_id:me.id, text });
 if(error) toast(error.message);
 else { input.value=''; renderChat(id); }

async function startChat(otherId){
 const { data:other } = await sb.from('profiles').select('blocked').eq('id',otherId).single();
 if(other?.blocked){ toast('لا يمكن التواصل مع مستخدم محظور'); return; }
 // Find existing conversation
 const { data:mine } = await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);
 const ids = (mine||[]).map(x=>x.conversation_id);
 if(ids.length){
  const { data:existing } = await sb.from('conversation_members').select('conversation_id').in('conversation_id',ids).eq('user_id',otherId);
  if(existing?.length){
   go('chat', existing[0].conversation_id);
   return;
  }
 }
 // Create new
 const { data:conv } = await sb.from('conversations').insert({}).select().single();
 if(!conv) { toast('خطأ في إنشاء المحادثة'); return; }
 const { error } = await sb.from('conversation_members').insert([
  { conversation_id:conv.id, user_id:me.id },
  { conversation_id:conv.id, user_id:otherId }
 ]);
 if(error){ toast(error.message); return; }
 go('chat', conv.id);
}

       <div class="flex" style="margin:6px 0">
        <img src="${esc(post.image_url)}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="go('post','${post.id}')">
        <div class="grow muted">${esc(post.caption?.substring(0,50)||'')}</div>
        ${post.profiles?.blocked ? '<span class="badge badge-danger">محظور</span>' : ''}
       </div>
       <div class="flex" style="flex-wrap:wrap;gap:6px">
        <button class="btn btn-danger btn-sm" onclick="adminDeletePost('${post.id}')">🗑️ حذف</button>
        <button class="btn btn-secondary btn-sm" onclick="go('profile','${post.profiles?.id}')">👤 مستخدم</button>
        ${!post.profiles?.blocked ? `<button class="btn btn-warning btn-sm" onclick="toggleBan('${post.profiles?.id}',false)">🔒 حظر</button>` : `<button class="btn btn-success btn-sm" onclick="toggleBan('${post.profiles?.id}',true)">🔓 فك</button>`}
       </div>
      ` : '<div class="muted">المنشور محذوف</div>'}
     </div>
    `;
   }).join('') : '<div class="empty">لا توجد بلاغات</div>'}
  </div>
 </div>
 `;
 document.getElementById('app').innerHTML = html;
}

async function adminDeletePost(id){
 if(!confirm('حذف المنشور نهائياً؟')) return;
 const { error } = await sb.from('posts').delete().eq('id',id);
 if(error) toast(error.message);
 else { toast('تم الحذف'); renderAdmin(); }
}

// ============================================================
// START APP
// ============================================================

boot();
</script>
</body>
