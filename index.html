<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>LabGram</title>

<style>
:root{
  --primary:#2563eb;
  --primary2:#06b6d4;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444;
  --shadow:0 8px 25px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1100px;
  height:64px;
  margin:auto;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:25px;
  font-weight:900;
  color:var(--primary);
  cursor:pointer;
}
.logo span{color:var(--primary2)}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.container{
  width:100%;
  max-width:720px;
  margin:20px auto;
  padding:0 12px 90px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}
.btn:hover{filter:brightness(.95)}
.btn.secondary{
  background:#eef2f7;
  color:var(--text);
}
.btn.danger{
  background:#fee2e2;
  color:#b91c1c;
}
.btn.full{width:100%}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}

/* AUTH */
.auth{
  max-width:410px;
  margin:45px auto;
  padding:30px;
}
.auth-logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:var(--primary);
}
.auth-logo span{color:var(--primary2)}
.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}
.field{
  margin-bottom:12px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}
input,textarea,select{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--primary);
}
textarea{
  min-height:90px;
  resize:vertical;
}
.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
}
.link{
  color:var(--primary);
  font-weight:700;
  cursor:pointer;
}
.error{
  color:var(--danger);
  font-size:13px;
  min-height:20px;
  margin:5px 0;
}

/* HOME */
.welcome{
  padding:18px;
  background:linear-gradient(135deg,#eff6ff,#ecfeff);
}
.welcome h2{margin:0 0 7px}
.welcome p{margin:0;color:var(--muted)}

.create{
  padding:16px;
}
.create-title{
  font-weight:800;
  margin-bottom:12px;
}
.file-label{
  display:block;
  border:2px dashed #cbd5e1;
  border-radius:10px;
  padding:20px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  margin-bottom:12px;
}
.file-label:hover{border-color:var(--primary)}
#imageInput{display:none}

.preview{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
}

/* POST */
.post-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
}
.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
.avatar.small{
  width:36px;
  height:36px;
  min-width:36px;
  font-size:13px;
}
.username{
  font-weight:800;
  cursor:pointer;
}
.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}
.category{
  margin-right:auto;
  background:#eff6ff;
  color:var(--primary);
  border-radius:20px;
  padding:5px 9px;
  font-size:11px;
  font-weight:700;
}
.post-image{
  display:block;
  width:100%;
  max-height:680px;
  object-fit:cover;
  background:#e2e8f0;
}
.post-body{
  padding:12px 14px;
}
.post-actions{
  display:flex;
  align-items:center;
  gap:17px;
  margin-bottom:8px;
}
.action{
  background:none;
  border:0;
  padding:2px;
  font-size:20px;
  color:var(--text);
}
.action.liked{color:var(--danger)}
.caption{
  line-height:1.7;
  font-size:14px;
}
.caption b{margin-left:5px}

.comments{
  border-top:1px solid var(--border);
  padding:12px 14px;
}
.comment{
  font-size:13px;
  margin-bottom:9px;
  line-height:1.5;
}
.comment b{margin-left:5px}
.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.comment-form input{margin:0}
.comment-form button{
  background:none;
  border:0;
  color:var(--primary);
  font-weight:800;
}

/* PROFILE */
.profile-card{
  padding:20px;
}
.profile-top{
  display:flex;
  gap:18px;
  align-items:center;
}
.avatar-big{
  width:95px;
  height:95px;
  min-width:95px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:32px;
  font-weight:900;
}
.profile-name{
  font-size:21px;
  font-weight:900;
}
.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--primary);
  color:#fff;
  border-radius:50%;
  width:18px;
  height:18px;
  font-size:11px;
}
.stats{
  display:flex;
  gap:25px;
  margin-top:13px;
}
.stat{
  text-align:center;
}
.stat b{
  display:block;
  font-size:17px;
}
.stat span{
  font-size:12px;
  color:var(--muted);
}
.bio{
  color:var(--muted);
  margin-top:13px;
  line-height:1.6;
}
.profile-actions{
  margin-top:14px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}
.grid img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  cursor:pointer;
}

/* SEARCH */
.search{
  margin-bottom:15px;
}
.result{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
}
.result-info{
  flex:1;
}
.result .btn{
  padding:7px 11px;
  font-size:12px;
}

/* DM */
.dm-list{
  overflow:hidden;
}
.dm-item{
  display:flex;
  gap:11px;
  align-items:center;
  padding:14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.dm-item:hover{background:#f8fafc}
.dm-info{flex:1}
.dm-preview{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}
.chat{
  display:flex;
  flex-direction:column;
  min-height:65vh;
}
.chat-head{
  padding:13px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}
.chat-body{
  flex:1;
  padding:15px;
  background:#f8fafc;
  min-height:400px;
}
.message{
  max-width:75%;
  padding:9px 12px;
  border-radius:15px;
  margin-bottom:8px;
  font-size:14px;
  line-height:1.5;
}
.message.mine{
  background:var(--primary);
  color:#fff;
  margin-right:auto;
  border-bottom-left-radius:4px;
}
.message.theirs{
  background:#fff;
  border:1px solid var(--border);
  margin-left:auto;
  border-bottom-right-radius:4px;
}
.message-time{
  font-size:9px;
  opacity:.65;
  display:block;
  margin-top:3px;
}
.chat-form{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid var(--border);
  background:#fff;
}
.chat-form input{margin:0}

/* NOTIFICATIONS */
.notification{
  padding:14px;
  border-bottom:1px solid var(--border);
}
.notification.unread{
  background:#eff6ff;
}
.notification-time{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

/* ADMIN */
.admin-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.metric-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:15px 0;
}
.metric{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}
.metric b{
  display:block;
  font-size:25px;
  margin-top:4px;
}
.admin-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.admin-row:last-child{border-bottom:0}
.admin-row-info{flex:1}
.badge{
  font-size:10px;
  padding:4px 7px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
}

/* EMPTY */
.empty{
  text-align:center;
  color:var(--muted);
  padding:55px 20px;
}

/* BOTTOM */
.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid var(--border);
  z-index:90;
}
.bottom-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  justify-content:space-around;
}
.bottom button{
  border:0;
  background:none;
  padding:8px 10px;
  color:var(--text);
  font-size:20px;
}
.bottom small{
  display:block;
  font-size:9px;
  margin-top:2px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  z-index:200;
  font-size:13px;
}

@media(max-width:600px){
  .container{margin-top:10px}
  .top-actions .hide-mobile{display:none}
  .profile-top{align-items:flex-start}
  .category{display:none}
  .auth{margin:20px 8px;padding:23px}
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo" onclick="go('feed')">
      Lab<span>Gram</span>
    </div>
    <div class="top-actions" id="topActions"></div>
  </div>
</header>

<main class="container" id="app"></main>

<nav class="bottom hidden" id="bottomNav"></nav>

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   LABGRAM V2 DEMO
   Standalone GitHub Pages version.
   No external libraries.
========================================================= */

const STORAGE_KEY="LABGRAM_DEMO_V2";
const SESSION_KEY="LABGRAM_SESSION_V2";

let db=loadDB();
let session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
let route=session ? "feed" : "login";
let param=null;
let selectedImage="";

function defaultDB(){
  return {
    users:[
      {
        id:1,
        username:"lab_expert",
        password:"1234",
        name:"Lab Expert",
        bio:"Histopathology • IHC • Laboratory Quality",
        specialty:"Histopathology",
        followers:[2],
        following:[2],
        verified:true,
        blocked:false
      },
      {
        id:2,
        username:"micro_lab",
        password:"1234",
        name:"Micro Lab",
        bio:"Microbiology • Education • Diagnostics",
        specialty:"Microbiology",
        followers:[1],
        following:[1],
        verified:true,
        blocked:false
      },
      {
        id:3,
        username:"hematology_pro",
        password:"1234",
        name:"Hematology Pro",
        bio:"Hematology and laboratory medicine",
        specialty:"Hematology",
        followers:[],
        following:[],
        verified:false,
        blocked:false
      }
    ],
    posts:[
      {
        id:1,
        userId:1,
        image:"https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=1000&q=80",
        caption:"Welcome to LabGram 🧪 A place to share laboratory knowledge and professional experience.",
        category:"Laboratory Quality",
        likes:[2],
        comments:[
          {userId:2,text:"Great idea for laboratory professionals!"}
        ],
        created:Date.now()-3600000
      },
      {
        id:2,
        userId:2,
        image:"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1000&q=80",
        caption:"Knowledge sharing can improve laboratory practice every day.",
        category:"Microbiology",
        likes:[],
        comments:[],
        created:Date.now()-7200000
      }
    ],
    conversations:[
      {
        id:1,
        members:[1,2],
        messages:[
          {
            id:1,
            sender:2,
            text:"Welcome to LabGram!",
            created:Date.now()-1800000
          }
        ]
      }
    ],
    notifications:[
      {
        id:1,
        userId:1,
        text:"micro_lab بدأ بمتابعتك",
        created:Date.now()-100000
      }
    ],
    reports:[],
    adminActions:[]
  };
}

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : defaultDB();
  }catch{
    return defaultDB();
  }
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function current(){
  return db.users.find(u=>u.id===session?.userId);
}

function findUser(id){
  return db.users.find(u=>u.id===id);
}

function nextId(items){
  return items.length ? Math.max(...items.map(x=>Number(x.id)||0))+1 : 1;
}

function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function ago(timestamp){
  const seconds=Math.floor((Date.now()-timestamp)/1000);
  if(seconds<60)return"الآن";
  if(seconds<3600)return Math.floor(seconds/60)+" د";
  if(seconds<86400)return Math.floor(seconds/3600)+" س";
  return Math.floor(seconds/86400)+" يوم";
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.add("hidden"),2200);
}

function go(newRoute,newParam=null){
  route=newRoute;
  param=newParam;
  selectedImage="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ================= HEADER ================= */

function renderHeader(){
  const actions=document.getElementById("topActions");
  const bottom=document.getElementById("bottomNav");
  const u=current();

  if(!u){
    actions.innerHTML=`
      <button class="btn" onclick="go('login')">دخول</button>
    `;
    bottom.classList.add("hidden");
    return;
  }

  actions.innerHTML=`
    <button class="btn secondary hide-mobile"
      onclick="go('profile',${u.id})">
      👤 ${escapeHTML(u.username)}
    </button>
    <button class="btn secondary" onclick="logout()">خروج</button>
  `;

  bottom.classList.remove("hidden");

  bottom.innerHTML=`
    <div class="bottom-inner">
      <button onclick="go('feed')">🏠<small>الرئيسية</small></button>
      <button onclick="go('search')">🔎<small>بحث</small></button>
      <button onclick="go('create')">➕<small>نشر</small></button>
      <button onclick="go('messages')">💬<small>رسائل</small></button>
      <button onclick="go('notifications')">🔔<small>تنبيهات</small></button>
    </div>
  `;
}

/* ================= AUTH ================= */

function loginPage(){
  document.getElementById("app").innerHTML=`
    <section class="card auth">
      <div class="auth-logo">Lab<span>Gram</span></div>

      <p class="auth-sub">
        مجتمع المختبرات والمهنيين الصحيين
      </p>

      <div class="field">
        <label>اسم المستخدم</label>
        <input id="loginUsername" autocomplete="username"
          placeholder="اسم المستخدم">
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input id="loginPassword" type="password"
          autocomplete="current-password"
          placeholder="كلمة المرور">
      </div>

      <div id="authError" class="error"></div>

      <button class="btn full" onclick="doLogin()">
        تسجيل الدخول
      </button>

      <div class="auth-switch">
        ليس لديك حساب؟
        <span class="link" onclick="go('register')">
          إنشاء حساب
        </span>
      </div>

      <div style="margin-top:22px;padding:12px;background:#f8fafc;border-radius:9px;font-size:12px;color:#64748b">
        <b>حساب Demo:</b><br>
        lab_expert / 1234
      </div>
    </section>
  `;
}

function registerPage(){
  document.getElementById("app").innerHTML=`
    <section class="card auth">
      <div class="auth-logo">Lab<span>Gram</span></div>

      <p class="auth-sub">
        أنشئ حسابك وابدأ مشاركة المعرفة
      </p>

      <div class="field">
        <label>اسم المستخدم</label>
        <input id="regUsername" placeholder="مثلاً: mamon_lab">
      </div>

      <div class="field">
        <label>الاسم</label>
        <input id="regName" placeholder="اسمك">
      </div>

      <div class="field">
        <label>التخصص</label>
        <select id="regSpecialty">
          <option>General</option>
          <option>Histopathology</option>
          <option>Microbiology</option>
          <option>Hematology</option>
          <option>Cytology</option>
          <option>Clinical Chemistry</option>
          <option>Laboratory Quality</option>
        </select>
      </div>

      <div class="field">
        <label>نبذة</label>
        <textarea id="regBio" placeholder="اكتب نبذة قصيرة"></textarea>
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input id="regPassword" type="password" placeholder="4 أحرف على الأقل">
      </div>

      <div id="authError" class="error"></div>

      <button class="btn full" onclick="doRegister()">
        إنشاء الحساب
      </button>

      <div class="auth-switch">
        لديك حساب؟
        <span class="link" onclick="go('login')">
          تسجيل الدخول
        </span>
      </div>
    </section>
  `;
}

function doLogin(){
  const username=document.getElementById("loginUsername").value.trim();
  const password=document.getElementById("loginPassword").value;

  const u=db.users.find(
    x=>x.username.toLowerCase()===username.toLowerCase()
  );

  if(!u || u.password!==password){
    document.getElementById("authError").textContent=
      "اسم المستخدم أو كلمة المرور غير صحيحة";
    return;
  }

  session={userId:u.id};
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));
  route="feed";
  render();
}

function doRegister(){
  const username=document.getElementById("regUsername").value.trim();
  const name=document.getElementById("regName").value.trim();
  const specialty=document.getElementById("regSpecialty").value;
  const bio=document.getElementById("regBio").value.trim();
  const password=document.getElementById("regPassword").value;

  if(username.length<3 || password.length<4){
    document.getElementById("authError").textContent=
      "اسم المستخدم 3 أحرف على الأقل وكلمة المرور 4 أحرف على الأقل";
    return;
  }

  if(db.users.some(x=>x.username.toLowerCase()===username.toLowerCase())){
    document.getElementById("authError").textContent=
      "اسم المستخدم موجود مسبقاً";
    return;
  }

  const u={
    id:nextId(db.users),
    username,
    name:name||username,
    password,
    bio,
    specialty,
    followers:[],
    following:[],
    verified:false,
    blocked:false
  };

  db.users.push(u);
  saveDB();

  session={userId:u.id};
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));

  route="feed";
  render();
}

function logout(){
  session=null;
  localStorage.removeItem(SESSION_KEY);
  route="login";
  render();
}

/* ================= FEED ================= */

function feedPage(){
  const u=current();

  const posts=[...db.posts]
    .filter(p=>!findUser(p.userId)?.blocked)
    .sort((a,b)=>b.created-a.created);

  document.getElementById("app").innerHTML=`
    <section class="card welcome">
      <h2>مرحباً ${escapeHTML(u.name)} 👋</h2>
      <p>
        شارك المعرفة والخبرات مع مجتمع المختبرات والمهنيين الصحيين.
      </p>
    </section>

    <section class="card create">
      <div class="create-title">📸 شارك منشوراً جديداً</div>

      <label class="file-label" for="imageInput">
        📷 اختر صورة من هاتفك
      </label>

      <input id="imageInput" type="file" accept="image/*">

      <img id="imagePreview" class="preview hidden">

      <select id="postCategory">
        <option>General</option>
        <option>Histopathology</option>
        <option>Microbiology</option>
        <option>Hematology</option>
        <option>Cytology</option>
        <option>Clinical Chemistry</option>
        <option>Laboratory Quality</option>
      </select>

      <textarea id="postCaption"
        placeholder="شارك معلومة أو حالة تعليمية أو تجربة مهنية..."
        maxlength="1000"></textarea>

      <button class="btn" onclick="publishPost()">
        نشر
      </button>
    </section>

    <div id="feed">
      ${
        posts.length
        ? posts.map(renderPost).join("")
        : `<div class="empty">لا توجد منشورات بعد.</div>`
      }
    </div>
  `;

  document.getElementById("imageInput").onchange=e=>{
    const file=e.target.files[0];
    if(!file)return;

    if(file.size>4*1024*1024){
      toast("اختر صورة أقل من 4 MB");
      e.target.value="";
      return;
    }

    const reader=new FileReader();

    reader.onload=()=>{
      selectedImage=reader.result;

      const preview=document.getElementById("imagePreview");
      preview.src=selectedImage;
      preview.classList.remove("hidden");
    };

    reader.readAsDataURL(file);
  };
}

function renderPost(p){
  const author=findUser(p.userId);
  const me=current();

  if(!author)return"";

  const liked=p.likes.includes(me.id);

  return`
    <article class="card">

      <div class="post-head">

        <div class="avatar"
          onclick="go('profile',${author.id})">
          ${escapeHTML(author.username[0].toUpperCase())}
        </div>

        <div>
          <div class="username"
            onclick="go('profile',${author.id})">
            ${escapeHTML(author.username)}
            ${author.verified
              ? `<span class="verified">✓</span>`:""}
          </div>

          <div class="meta">
            ${ago(p.created)}
          </div>
        </div>

        <div class="category">
          ${escapeHTML(p.category)}
        </div>

      </div>

      <img
        class="post-image"
        src="${p.image}"
        alt="LabGram post">

      <div class="post-body">

        <div class="post-actions">

          <button
            class="action ${liked?"liked":""}"
            onclick="toggleLike(${p.id})">
            ${liked?"♥":"♡"} ${p.likes.length}
          </button>

          <button
            class="action"
            onclick="focusComment(${p.id})">
            💬 ${p.comments.length}
          </button>

          <button
            class="action"
            onclick="reportPost(${p.id})">
            🚩
          </button>

          ${
            p.userId===me.id
            ? `<button class="action"
                 onclick="deletePost(${p.id})">🗑️</button>`
            :""
          }

        </div>

        ${
          p.caption
          ? `<div class="caption">
              <b>${escapeHTML(author.username)}</b>
              ${escapeHTML(p.caption)}
             </div>`
          :""
        }

      </div>

      <div class="comments">

        ${
          p.comments.length
          ? p.comments.map(c=>{
              const cu=findUser(c.userId);
              return`
                <div class="comment">
                  <b>${escapeHTML(cu?.username||"User")}</b>
                  ${escapeHTML(c.text)}
                </div>
              `;
            }).join("")
          : `<div class="meta">لا توجد تعليقات بعد.</div>`
        }

        <form
          class="comment-form"
          onsubmit="addComment(event,${p.id})">

          <input
            id="comment-${p.id}"
            maxlength="300"
            placeholder="اكتب تعليقاً...">

          <button>نشر</button>

        </form>

      </div>

    </article>
  `;
}

function publishPost(){
  if(!selectedImage){
    toast("اختر صورة أولاً");
    return;
  }

  const caption=document.getElementById("postCaption").value.trim();
  const category=document.getElementById("postCategory").value;

  db.posts.unshift({
    id:nextId(db.posts),
    userId:current().id,
    image:selectedImage,
    caption,
    category,
    likes:[],
    comments:[],
    created:Date.now()
  });

  saveDB();
  selectedImage="";
  toast("تم نشر المنشور");
  render();
}

function toggleLike(id){
  const p=db.posts.find(x=>x.id===id);
  const me=current();

  if(!p)return;

  const index=p.likes.indexOf(me.id);

  if(index===-1){
    p.likes.push(me.id);

    if(p.userId!==me.id){
      db.notifications.push({
        id:nextId(db.notifications),
        userId:p.userId,
        text:`${me.username} أعجب بمنشورك`,
        created:Date.now()
      });
    }
  }else{
    p.likes.splice(index,1);
  }

  saveDB();
  render();
}

function addComment(event,id){
  event.preventDefault();

  const input=document.getElementById("comment-"+id);
  const text=input.value.trim();

  if(!text)return;

  const p=db.posts.find(x=>x.id===id);
  if(!p)return;

  p.comments.push({
    userId:current().id,
    text
  });

  if(p.userId!==current().id){
    db.notifications.push({
      id:nextId(db.notifications),
      userId:p.userId,
      text:`${current().username} علّق على منشورك`,
      created:Date.now()
    });
  }

  saveDB();
  render();
}

function focusComment(id){
  const el=document.getElementById("comment-"+id);
  if(el){
    el.focus();
    return;
  }

  render();

  setTimeout(()=>{
    document.getElementById("comment-"+id)?.focus();
  },100);
}

function deletePost(id){
  const p=db.posts.find(x=>x.id===id);

  if(!p || p.userId!==current().id)return;

  if(!confirm("هل تريد حذف هذا المنشور؟"))return;

  db.posts=db.posts.filter(x=>x.id!==id);
  saveDB();
  render();
}

function reportPost(id){
  const reason=prompt("سبب البلاغ؟");

  if(!reason)return;

  db.reports.push({
    id:nextId(db.reports),
    reporterId:current().id,
    postId:id,
    reason,
    status:"OPEN",
    created:Date.now()
  });

  saveDB();
  toast("تم إرسال البلاغ للمراجعة");
}

/* ================= PROFILE ================= */

  const p=findUser(id);

  if(!p){
    document.getElementById("app").innerHTML=
      `<div class="empty">المستخدم غير موجود.</div>`;
    return;
  }

  const me=current();
  const mine=p.id===me.id;
  const following=p.followers.includes(me.id);

  const posts=db.posts.filter(x=>x.userId===p.id);

  document.getElementById("app").innerHTML=`

    <section class="card profile-card">

      <div class="profile-top">

        <div class="avatar-big">
          ${escapeHTML(p.username[0].toUpperCase())}
        </div>

        <div>

          <div class="profile-name">
            ${escapeHTML(p.username)}
            ${p.verified
              ? `<span class="verified">✓</span>`:""}
          </div>

          <div class="meta">
            ${escapeHTML(p.specialty)}
          </div>

          <div class="stats">

            <div class="stat">
              <b>${posts.length}</b>
              <span>منشورات</span>
            </div>

            <div class="stat">
              <b>${p.followers.length}</b>
              <span>متابعين</span>
            </div>

            <div class="stat">
              <b>${p.following.length}</b>
              <span>يتابع</span>
            </div>

          </div>

        </div>

      </div>

      <div class="bio">
        ${escapeHTML(p.bio||"")}
      </div>

      <div class="profile-actions">

        ${
          mine
          ? `<button class="btn secondary"
                onclick="editProfile()">
                تعديل الملف
             </button>`
          : `
             <button class="btn ${following?"secondary":""}"
               onclick="toggleFollow(${p.id})">
               ${following?"متابَع":"متابعة"}
             </button>

             <button class="btn secondary"
               onclick="startChat(${p.id})">
               💬 رسالة
             </button>

             <button class="btn secondary"
               onclick="blockUser(${p.id})">
               🚫 حظر
             </button>
            `
        }

      </div>

    </section>

    <h3>منشورات ${escapeHTML(p.username)}</h3>

    ${
      posts.length
      ? `<div class="grid">
          ${posts.map(x=>`
            <img
              src="${x.image}"
              onclick="openPost(${x.id})">
          `).join("")}
         </div>`
      : `<div class="empty">لا توجد منشورات.</div>`
    }
  `;
}

function toggleFollow(id){
  const me=current();
  const target=findUser(id);

  if(!target)return;

  const index=target.followers.indexOf(me.id);

  if(index===-1){
    target.followers.push(me.id);
    if(!me.following.includes(id)){
      me.following.push(id);
    }

    db.notifications.push({
      id:nextId(db.notifications),
      userId:id,
      text:`${me.username} بدأ بمتابعتك`,
      created:Date.now()
    });

  }else{
    target.followers.splice(index,1);
    me.following=me.following.filter(x=>x!==id);
  }

  saveDB();
  profilePage(id);
}

function editProfile(){
  const me=current();

  const name=prompt("الاسم:",me.name);
  if(name===null)return;

  const bio=prompt("النبذة:",me.bio||"");
  if(bio===null)return;

  me.name=name.trim()||me.username;
  me.bio=bio.trim();

  saveDB();
  profilePage(me.id);
}

function blockUser(id){
  const target=findUser(id);
  if(!target)return;

  if(!confirm(`حظر ${target.username}؟`))return;

  target.blocked=true;

  current().following=
    current().following.filter(x=>x!==id);

  target.followers=
    target.followers.filter(x=>x!==current().id);

  saveDB();
  toast("تم حظر المستخدم");
  go("feed");
}

function openPost(id){
  const p=db.posts.find(x=>x.id===id);
  if(!p)return;

  document.getElementById("app").innerHTML=renderPost(p);
}

/* ================= SEARCH ================= */

function searchPage(){
  document.getElementById("app").innerHTML=`

    <div class="search">
      <input
        id="searchInput"
        placeholder="🔎 ابحث عن مستخدم أو تخصص..."
        oninput="runSearch()">
    </div>

    <div id="searchResults"></div>
  `;

  runSearch();
}

function runSearch(){
  const q=(document.getElementById("searchInput")?.value||"")
    .trim()
    .toLowerCase();

  const me=current();

  const users=db.users.filter(u=>
    !u.blocked &&
    (
      u.username.toLowerCase().includes(q) ||
      u.name.toLowerCase().includes(q) ||
      u.specialty.toLowerCase().includes(q)
    )
  );

  document.getElementById("searchResults").innerHTML=
    users.map(u=>`

      <div class="card result">

        <div class="avatar small">
          ${escapeHTML(u.username[0].toUpperCase())}
        </div>

        <div class="result-info">

          <div class="username"
            onclick="go('profile',${u.id})">
            ${escapeHTML(u.username)}
            ${u.verified
              ? `<span class="verified">✓</span>`:""}
          </div>

          <div class="meta">
            ${escapeHTML(u.specialty)}
          </div>

        </div>

        ${
          u.id!==me.id
          ? `<button class="btn secondary"
              onclick="startChat(${u.id})">
              رسالة
             </button>`
          :""
        }

      </div>
    `).join("") ||
    `<div class="empty">لا توجد نتائج.</div>`;
}

/* ================= MESSAGING ================= */

function getConversation(otherId){
  const me=current();

  return db.conversations.find(c=>
    c.members.includes(me.id) &&
    c.members.includes(otherId) &&
    c.members.length===2
  );
}

function startChat(otherId){
  const other=findUser(otherId);
  if(!other)return;

  let conversation=getConversation(otherId);

  if(!conversation){
    conversation={
      id:nextId(db.conversations),
      members:[current().id,otherId],
      messages:[]
    };

    db.conversations.push(conversation);
    saveDB();
  }

  go("chat",conversation.id);
}

function messagesPage(){
  const me=current();

  const conversations=db.conversations
    .filter(c=>c.members.includes(me.id));

  document.getElementById("app").innerHTML=`

    <h2>💬 الرسائل</h2>

    <section class="card dm-list">

      ${
        conversations.length
        ? conversations.map(c=>{

          const otherId=c.members.find(x=>x!==me.id);
          const other=findUser(otherId);
          const last=c.messages[c.messages.length-1];

          return`
            <div class="dm-item"
              onclick="go('chat',${c.id})">

              <div class="avatar small">
                ${escapeHTML(other?.username?.[0]?.toUpperCase()||"?")}
              </div>

              <div class="dm-info">

                <div class="username">
                  ${escapeHTML(other?.username||"User")}
                </div>

                <div class="dm-preview">
                  ${escapeHTML(last?.text||"ابدأ المحادثة")}
                </div>

              </div>

              <div class="meta">
                ${last?ago(last.created):""}
              </div>

            </div>
          `;

        }).join("")
        : `<div class="empty">
            لا توجد محادثات بعد.<br><br>
            ابحث عن مستخدم وابدأ مراسلة.
           </div>`
      }

    </section>
  `;
}

function chatPage(conversationId){
  const c=db.conversations.find(x=>x.id===conversationId);

  if(!c){
    go("messages");
    return;
  }

  const me=current();
  const otherId=c.members.find(x=>x!==me.id);
  const other=findUser(otherId);

  document.getElementById("app").innerHTML=`

    <section class="card chat">

      <div class="chat-head">

        <button class="btn secondary"
          onclick="go('messages')">
          ←
        </button>

        <div class="avatar small">
          ${escapeHTML(other.username[0].toUpperCase())}
        </div>

        <div>
          <div class="username">
            ${escapeHTML(other.username)}
          </div>
          <div class="meta">
            ${escapeHTML(other.specialty)}
          </div>
        </div>

      </div>

      <div class="chat-body" id="chatBody">

        ${
          c.messages.length
          ? c.messages.map(m=>`

              <div class="message ${
                m.sender===me.id?"mine":"theirs"
              }">

                ${escapeHTML(m.text)}

                <span class="message-time">
                  ${new Date(m.created).toLocaleTimeString([],{
                    hour:"2-digit",
                    minute:"2-digit"
                  })}
                </span>

              </div>

            `).join("")
          : `<div class="empty">
              ابدأ المحادثة 👋
             </div>`
        }

      </div>

      <form class="chat-form"
        onsubmit="sendMessage(event,${c.id})">

        <input
          id="messageInput"
          maxlength="1000"
          placeholder="اكتب رسالة...">

        <button class="btn">إرسال</button>

      </form>

    </section>
  `;

  const body=document.getElementById("chatBody");
  body.scrollTop=body.scrollHeight;
}

function sendMessage(event,conversationId){
  event.preventDefault();

  const input=document.getElementById("messageInput");
  const text=input.value.trim();

  if(!text)return;

  const c=db.conversations.find(x=>x.id===conversationId);

  c.messages.push({
    id:nextId(c.messages),
    sender:current().id,
    text,
    created:Date.now()
  });

  const otherId=c.members.find(x=>x!==current().id);

  db.notifications.push({
    id:nextId(db.notifications),
    userId:otherId,
    text:`${current().username} أرسل لك رسالة`,
    created:Date.now()
  });

  saveDB();
  chatPage(conversationId);
}

function adminToggleBlock(id){
  if(!isOwner())return;

  const u=findUser(id);

  if(!u)return;

  u.blocked=!u.blocked;

  db.adminActions.push({
    id:nextId(db.adminActions),
    adminId:current().id,
    action:u.blocked?"BLOCK_USER":"UNBLOCK_USER",
    targetUserId:id,
    created:Date.now()
  });

  saveDB();
  adminPage();
}

function resolveReport(id){
  if(!isOwner())return;

  const r=db.reports.find(x=>x.id===id);

  if(!r)return;

  r.status="RESOLVED";

  db.adminActions.push({
    id:nextId(db.adminActions),
    adminId:current().id,
    action:"RESOLVE_REPORT",
    targetPostId:r.postId,
    created:Date.now()
  });

  saveDB();
  adminPage();
}

/* ================= ROUTER ================= */

function render(){
  renderHeader();

  if(!current()){
    if(route==="register"){
      registerPage();
    }else{
      loginPage();
    }
    return;
  }

  switch(route){
    case"feed":
      feedPage();
      break;

    case"create":
      feedPage();
      setTimeout(()=>{
        document.getElementById("imageInput")?.focus();
      },50);
      break;

    case"profile":
      profilePage(param);
      break;

    case"search":
      searchPage();
      break;

    case"messages":
      messagesPage();
      break;

    case"chat":
      chatPage(param);
      break;

    case"notifications":
      notificationsPage();
      break;

    case"admin":
      adminPage();
      break;

    default:
      feedPage();
  }

  /*
    يظهر رابط الإدارة للـOwner فقط.
    هذه حماية Demo وليست حماية Production.
  */

  if(current() && isOwner()){
    const actions=document.getElementById("topActions");

    actions.insertAdjacentHTML(
      "afterbegin",
      `<button class="btn secondary hide-mobile"
        onclick="go('admin')">🛡️ Admin</button>`
    );
  }
}

render();
