<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">

<title>LabGram | مجتمع المختبرات</title>

<style>
:root{
  --primary:#2563eb;
  --primary2:#06b6d4;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#64748b;
  --border:#e2e8f0;
  --danger:#ef4444;
  --success:#16a34a;
  --shadow:0 8px 25px rgba(15,23,42,.07);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Segoe UI",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  max-width:1100px;
  height:64px;
  margin:auto;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:25px;
  font-weight:900;
  color:var(--primary);
  cursor:pointer;
}

.logo span{
  color:var(--primary2);
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.container{
  width:100%;
  max-width:720px;
  margin:20px auto;
  padding:0 12px 95px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}

.btn:hover{
  filter:brightness(.95);
}

.btn.secondary{
  background:#eef2f7;
  color:var(--text);
}

.btn.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.btn.full{
  width:100%;
}

.btn.success{
  background:var(--success);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}

/* AUTH */

.auth{
  max-width:420px;
  margin:45px auto;
  padding:30px;
}

.auth-logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  color:var(--primary);
}

.auth-logo span{
  color:var(--primary2);
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px 12px;
  background:#fff;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
}

.link{
  color:var(--primary);
  font-weight:700;
  cursor:pointer;
}

.error{
  color:var(--danger);
  font-size:13px;

/* HOME */

.welcome{
  padding:18px;
  background:linear-gradient(135deg,#eff6ff,#ecfeff);
}

.welcome h2{
  margin:0 0 7px;
}

.welcome p{
  margin:0;
  color:var(--muted);
}

.create{

}

.create-title{
  font-weight:800;

}

.file-label{
  display:block;

  border-radius:10px;
  padding:20px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  margin-bottom:12px;
}

.file-label:hover{
  border-color:var(--primary);
}

#imageInput{
  display:none;
}

.preview{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
}

/* POST */

.post-head{

  align-items:center;
  gap:10px;
  padding:13px;
}

.avatar{

  height:44px;

}

}

.username{

}

.meta{

}

.category{

  background:#eff6ff;
  color:var(--primary);
  border-radius:20px;
  padding:5px 9px;

}

.post-image{
  display:block;
  width:100%;
  max-height:680px;
  object-fit:cover;

.post-body{
  padding:12px 14px;

.post-actions{

.action{

.comment{

.comment b{
  margin-left:5px;

.comment-form{

  gap:8px;

}

.comment-form input{
  margin:0;
}

.comment-form button{
  background:none;

/* PROFILE */

.profile-card{

}

.profile-top{

  gap:18px;

}

.avatar-big{

  height:95px;

  border-radius:50%;

.profile-name{

.verified{

.stat{

}

.stat b{

.stat span{

.profile-actions{
  margin-top:14px;

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

.grid img{
  width:100%;
  aspect-ratio:1;

/* SEARCH */

.search{

/* DM */

.dm-list{
  overflow:hidden;
}

.dm-item{
  display:flex;
  gap:11px;
  align-items:center;
  padding:14px;

}

.dm-item:hover{

}

.dm-info{

}

.dm-preview{

  margin-top:4px;
}

.chat{
  display:flex;

}

.chat-head{
  padding:13px;
  border-bottom:1px solid var(--border);

  align-items:center;
  gap:10px;
}

.chat-body{
  flex:1;

.message{

.message.mine{

.chat-form input{

/* NOTIFICATIONS */

.notification{

}

.notification.unread{

}

.notification-time{

/* ADMIN */

.admin-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.metric-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  margin:15px 0;

.metric{

  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
}

.metric b{
  display:block;
  font-size:25px;
  margin-top:4px;
}

.admin-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}

.admin-row:last-child{
  border-bottom:0;
}

.admin-row-info{
  flex:1;
}

.badge{
  font-size:10px;
  padding:4px 7px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;

  background:#fff;
  border-top:1px solid var(--border);
  z-index:90;
}

.bottom-inner{
  max-width:720px;
  margin:auto;
  display:flex;
  justify-content:space-around;
}

.bottom button{
  border:0;
  background:none;
  padding:8px 10px;
  color:var(--text);
  font-size:20px;
}

.bottom small{
  display:block;
  font-size:9px;
  margin-top:2px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:75px;
  transform:translateX(-50%);
  background:#172033;
  color:#fff;
  padding:10px 15px;
  border-radius:9px;
  z-index:200;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:40px;
  color:var(--muted);

@media(max-width:600px){

  .container{
    margin-top:10px;
  }

  .top-actions .hide-mobile{
    display:none;
  }

  .profile-top{
    align-items:flex-start;
  }

  .category{
    display:none;
  }

  .auth{
    margin:20px 8px;
    padding:23px;
  }

  }

</style>
</head>

<body>

<header class="header">

  <div class="header-inner">

    <div class="logo" onclick="go('feed')">
      Lab<span>Gram</span>
    </div>

    <div class="top-actions" id="topActions"></div>

  </div>

</header>

<main class="container" id="app"></main>

<nav class="bottom hidden" id="bottomNav"></nav>

<div id="toast" class="toast hidden"></div>

<script>

/* =========================================================
   LABGRAM V3
   Supabase powered MVP
========================================================= */

const SUPABASE_URL =
"https://ualumobbhukgmjbznhea.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Rq7Jp7tlZO5ugDORHcCebQ_NZJnVXrZ";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

let sessionUser=null;
let profile=null;

let route="login";
let param=null;

let selectedFile=null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.add("hidden");
  },2500);

}


function ago(date){

  const seconds=
    Math.floor(
      (Date.now()-new Date(date).getTime())/1000
    );

  if(seconds<60)return"الآن";

  if(seconds<3600)
    return Math.floor(seconds/60)+" د";

  if(seconds<86400)
    return Math.floor(seconds/3600)+" س";

  return Math.floor(seconds/86400)+" يوم";

}


function initial(name){

  return String(name||"?")
    .trim()
    .charAt(0)
    .toUpperCase();

}


/* =========================================================
   AUTH
========================================================= */

async function init(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();

  if(session){

    sessionUser=session.user;

    await loadProfile();

    route="feed";

  }else{

    route="login";

  }

  render();

}


async function loadProfile(){

  if(!sessionUser)return null;

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id",sessionUser.id)
    .maybeSingle();

  if(error){

    console.error(error);

    toast("تعذر تحميل الملف الشخصي");

    return null;

  }

  profile=data;

  return data;

}


async function doLogin(){

  const email=
    document.getElementById("loginEmail")
      .value.trim();

  const password=
    document.getElementById("loginPassword")
      .value;

  const errorEl=
    document.getElementById("authError");

  errorEl.textContent="";

  if(!email || !password){

    errorEl.textContent=
      "أدخل البريد الإلكتروني وكلمة المرور";

    return;

  }

  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    errorEl.textContent=
      translateAuthError(error.message);

    return;

  }

  sessionUser=data.user;

  await loadProfile();

  route="feed";

  render();

}


function translateAuthError(message){

  if(message.includes("Invalid login credentials"))
    return"البريد الإلكتروني أو كلمة المرور غير صحيحة";

  if(message.includes("Email not confirmed"))
    return"يجب تأكيد البريد الإلكتروني أولاً";

  return message;

}


async function doRegister(){

  const email=
    document.getElementById("regEmail")
      .value.trim();

  const username=
    document.getElementById("regUsername")
      .value.trim();

  const name=
    document.getElementById("regName")
      .value.trim();

  const specialty=
    document.getElementById("regSpecialty")
      .value;

  const bio=
    document.getElementById("regBio")
      .value.trim();

  const password=
    document.getElementById("regPassword")
      .value;

  const errorEl=
    document.getElementById("authError");

  errorEl.textContent="";

  if(username.length<3){

    errorEl.textContent=
      "اسم المستخدم يجب أن يكون 3 أحرف على الأقل";

    return;

  }

  if(!email.includes("@")){

    errorEl.textContent=
      "أدخل بريدًا إلكترونيًا صحيحًا";

    return;

  }

  if(password.length<6){

    errorEl.textContent=
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل";

    return;

  }


  /* Check username */

  const {
    data:existing
  } =
  await supabaseClient
    .from("profiles")
    .select("id")
    .eq("username",username)
    .maybeSingle();

  if(existing){

    errorEl.textContent=
      "اسم المستخدم مستخدم مسبقًا";

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email,
    password,

    options:{
      data:{
        username,
        display_name:name || username,
        specialty,
        bio
      }
    }

  });


  if(error){

    errorEl.textContent=
      translateAuthError(error.message);

    return;

  }


  /*
    إذا كان Confirm Email مفعلاً،
    لن توجد session حتى يتم التأكيد.
  */

  if(data.session){

    sessionUser=data.user;

    await loadProfile();

    route="feed";

    render();

  }else{

    toast("تم إنشاء الحساب. افحص بريدك الإلكتروني للتأكيد.");

    go("login");

  }

}


async function logout(){

  await supabaseClient.auth.signOut();

  sessionUser=null;
  profile=null;

  route="login";

  render();

}


/* =========================================================
   NAVIGATION
========================================================= */

function go(newRoute,newParam=null){

  route=newRoute;

  param=newParam;

  selectedFile=null;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   HEADER
========================================================= */

function renderHeader(){

  const actions=
    document.getElementById("topActions");

  const bottom=
    document.getElementById("bottomNav");

  if(!sessionUser || !profile){

    actions.innerHTML=`
      <button class="btn"
        onclick="go('login')">
        دخول
      </button>
    `;

    bottom.classList.add("hidden");

    return;

  }


  actions.innerHTML=`

    <button
      class="btn secondary hide-mobile"
      onclick="go('profile','${profile.id}')">

      👤 ${escapeHTML(profile.username)}

    </button>

    <button
      class="btn secondary"
      onclick="logout()">

      خروج

    </button>

  `;


  bottom.classList.remove("hidden");


  bottom.innerHTML=`

    <div class="bottom-inner">

      <button onclick="go('feed')">
        🏠
        <small>الرئيسية</small>
      </button>

      <button onclick="go('search')">
        🔎
        <small>بحث</small>
      </button>

      <button onclick="go('create')">
        ➕
        <small>نشر</small>
      </button>

      <button onclick="go('messages')">
        💬
        <small>رسائل</small>
      </button>

      <button onclick="go('notifications')">
        🔔
        <small>تنبيهات</small>
      </button>

    </div>

  `;

}


/* =========================================================
   LOGIN PAGE
========================================================= */

function loginPage(){

      <div class="auth-logo">

  `;

}


/* =========================================================
   REGISTER
========================================================= */

function registerPage(){

  document.getElementById("app").innerHTML=`

    <section class="card auth">

        Lab<span>Gram</span>
      </div>

      <p class="auth-sub">
        أنشئ حسابك المهني
      </p>


      <div class="field">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="regEmail"
          type="email"

      </div>


      <div class="field">

        <label>

        <input

      </div>


      <div class="field">

        <label>

        <input

      </div>


      <div class="field">

        <label>
          التخصص

        <select id="regSpecialty">

          <option>General</option>

          <option>
            Histopathology
          </option>

          <option>
            Microbiology
          </option>

          <option>
            Hematology
          </option>

          <option>
            Cytology
          </option>

          <option>

function handleImage(event){

  const file=
    event.target.files[0];

  if(!file)return;


  if(file.size>5*1024*1024){

    toast("الصورة يجب أن تكون أقل من 5 MB");

    event.target.value="";

    return;

  }


  selectedFile=file;


  const reader=
    new FileReader();


  reader.onload=()=>{

    const preview=
      document.getElementById("imagePreview");

    preview.src=reader.result;

    preview.classList.remove("hidden");

  };


  reader.readAsDataURL(file);

}


/* =========================================================
   STORAGE
========================================================= */

async function uploadPostImage(file){

  if(!file)
    throw new Error("اختر صورة");


  const extension=
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const path=
    `${sessionUser.id}/${crypto.randomUUID()}.${extension}`;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from("post-images")
    .upload(
      path,
      file,
      {
        cacheControl:"3600",
        upsert:false,
        contentType:file.type
      }
    );


  if(error)
    throw error;


  const {
    data
  } =
  supabaseClient
    .storage
    .from("post-images")
    .getPublicUrl(path);


  return data.publicUrl;

}

  try{

async function startChat(otherId){

  const {
    data:existingMembers
  } =
  await supabaseClient
    .from("conversation_members")
    .select("conversation_id")
    .eq("user_id",sessionUser.id);


  let conversationId=null;


  if(existingMembers?.length){

    for(const item of existingMembers){

      const {
        data:member
      } =
      await supabaseClient
        .from("conversation_members")
        .select("user_id")
        .eq("conversation_id",item.conversation_id)
        .eq("user_id",otherId)
        .maybeSingle();


      if(member){

        conversationId=
          item.conversation_id;

        break;

      }

    }

  }


  if(!conversationId){

    const {
      data:conversation,
      error
    } =
    await supabaseClient
      .from("conversations")
      .insert({})
      .select()
      .single();


    if(error){

      toast(error.message);

      return;

    }


    conversationId=conversation.id;


    await supabaseClient
      .from("conversation_members")
      .insert([
        {
          conversation_id:conversationId,
          user_id:sessionUser.id
        },
        {
          conversation_id:conversationId,
          user_id:otherId
        }
      ]);

  }


  go("chat",conversationId);

}

  } =
  await supabaseClient
    .from("conversation_members")
    .select(`
      user_id,
      profiles(
        username,
        display_name,
        specialty
      )
    `)
    .eq("conversation_id",conversationId);


  const other=
    members?.find(
      x=>x.user_id!==sessionUser.id
    );


  if(!other){

    go("messages");

    return;

  }


  document.getElementById("app").innerHTML=`

    <section class="card chat">


      <div class="chat-head">


        <button
          class="btn secondary"
          onclick="go('messages')">

          ←

        </button>


        <div class="avatar small">

          ${escapeHTML(
            initial(
              other.profiles.username
            )
          )}

        </div>


        <div>

          <div class="username">

            ${escapeHTML(
              other.profiles.username
            )}

          </div>


          <div class="meta">

            ${escapeHTML(
              other.profiles.specialty
            )}

          </div>

        </div>


      </div>


      <div
        class="chat-body"
        id="chatBody">

        جاري تحميل الرسائل...

      </div>


      <form
        class="chat-form"
        onsubmit="sendMessage(event,'${conversationId}')">


        <input
          id="messageInput"
          maxlength="1000"
          placeholder="اكتب رسالة...">


        <button class="btn">
          إرسال
        </button>


      </form>


    </section>

  `;


  await loadMessages(conversationId);

}


async function loadMessages(conversationId){

  const body=
    document.getElementById("chatBody");


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("*")
    .eq("conversation_id",conversationId)
    .order("created_at",{ascending:true});


  if(error){

    body.innerHTML=
      escapeHTML(error.message);

    return;

  }


  if(!data?.length){

    body.innerHTML=`
      <div class="empty">
        ابدأ المحادثة 👋
      </div>
    `;

    return;

  }


  body.innerHTML=
    data.map(message=>`

      <div
        class="message ${
          message.sender_id===sessionUser.id
          ?"mine"
          :"theirs"
        }">

        ${escapeHTML(message.text)}

        <span class="message-time">

          ${new Date(
            message.created_at
          ).toLocaleTimeString([],{
            hour:"2-digit",
            minute:"2-digit"
          })}

        </span>

      </div>

    `).join("");


  body.scrollTop=
    body.scrollHeight;

}


async function sendMessage(event,conversationId){

  event.preventDefault();


  const input=
    document.getElementById(
      "messageInput"
    );


  const text=
    input.value.trim();


  if(!text)return;


  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({
      conversation_id:conversationId,
      sender_id:sessionUser.id,
      text
    });


  if(error){

    toast(error.message);

    return;

  }


  input.value="";


  await loadMessages(conversationId);

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

async function notificationsPage(){

  document.getElementById("app").innerHTML=`

    <h2>
      🔔 التنبيهات
    </h2>

    <section
      class="card"
      id="notificationsList">

      <div class="loading">
        جاري التحميل...
      </div>

    </section>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("notifications")
    .select(`
      id,
      text,
      type,
      is_read,
      created_at,
      profiles:actor_id(
        username
      )
    `)
    .eq("user_id",sessionUser.id)
    .order("created_at",{ascending:false});


  const list=
    document.getElementById(
      "notificationsList"
    );


  if(error){

    list.innerHTML=`
      <div class="empty">
        ${escapeHTML(error.message)}
      </div>
    `;

    return;

  }


  if(!data?.length){

    list.innerHTML=`
      <div class="empty">
        لا توجد تنبيهات.
      </div>
    `;

    return;

  }


  list.innerHTML=
    data.map(n=>`

      <div
        class="notification ${
          n.is_read
          ? ""
          :"unread"
        }">

        ${escapeHTML(
          n.text ||
          `${n.profiles?.username||"User"} لديك إشعار جديد`
        )}

        <div class="notification-time">

          ${ago(n.created_at)}

        </div>

      </div>

    `).join("");


}

   OPEN POST
========================================================= */

async function openPost(postId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(`
      id,
      user_id,
      image_url,
      caption,
      category,
      created_at,
      profiles(
        id,
        username,
        display_name,
        specialty,
        verified
      ),
      likes(user_id),
      comments(
        id,
        user_id,
        text,
        created_at,
        profiles(username)
      )
    `)
    .eq("id",postId)
    .maybeSingle();


  if(error || !data){

    toast("المنشور غير موجود");

    return;

  }


  document.getElementById("app").innerHTML=
    renderPost(data);

}


/* =========================================================
   ROUTER
========================================================= */

async function render(){

  renderHeader();


  if(!sessionUser){

    if(route==="register")
      registerPage();
    else
      loginPage();

    return;

  }


  if(!profile){

    document.getElementById("app").innerHTML=`
      <div class="loading">
        جاري تحميل الحساب...
      </div>
    `;

    await loadProfile();

  }


  switch(route){

    case"feed":
      await feedPage();
      break;


    case"create":
      createPage();
      break;


    case"profile":
      await profilePage(param);
      break;


    case"search":
      searchPage();
      break;


    case"messages":
      await messagesPage();
      break;


    case"chat":
      await chatPage(param);
      break;


    case"notifications":
      await notificationsPage();
      break;


    default:
      await feedPage();

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event,newSession)=>{

    if(newSession){

      sessionUser=
        newSession.user;

      await loadProfile();

    }else{

      sessionUser=null;
      profile=null;

    }

  }
);


/* START */

init();

</script>
