<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="LabGram - مجتمع المختبرات والمهنيين الصحيين">
<title>LabGram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --p:#2563eb;
 --p2:#06b6d4;
 --bg:#f4f7fb;
 --card:#fff;
 --text:#172033;
 --muted:#64748b;
 --border:#e2e8f0;
 --danger:#ef4444;
 --success:#16a34a;
 --warning:#f59e0b;
 --shadow:0 8px 28px rgba(15,23,42,.08)
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,"Segoe UI",sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.header{
 position:sticky;
 top:0;
 z-index:50;
 background:#fff;
 border-bottom:1px solid var(--border)
}

.head{
 height:62px;
 max-width:1100px;
 margin:auto;
 padding:0 14px;
 display:flex;
 align-items:center;
 justify-content:space-between
}

.logo{
 font-size:25px;
 font-weight:900;
 color:var(--p);
 cursor:pointer
}

.logo span{color:var(--p2)}

.actions{
 display:flex;
 gap:7px;
 align-items:center
}

.container{
 max-width:720px;
 margin:16px auto;
 padding:0 12px 95px
}

.btn{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:var(--p);
 color:#fff;
 font-weight:800
}

.btn.secondary{
 background:#eef2f7;
 color:var(--text)
}

.btn.danger{
 background:#fee2e2;
 color:#b91c1c
}

.btn.success{
 background:#dcfce7;
 color:#166534
}

.btn.warning{
 background:#fef3c7;
 color:#92400e
}

.full{width:100%}

.card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:15px;
 box-shadow:var(--shadow);
 overflow:hidden;
 margin-bottom:15px
}

.auth{
 max-width:420px;
 margin:35px auto;
 padding:28px
}

.authlogo{
 text-align:center;
 font-size:34px;
 font-weight:900;
 color:var(--p)
}

.authlogo span{color:var(--p2)}

.sub{
 text-align:center;
 color:var(--muted);
 margin:8px 0 24px
}

.field{margin-bottom:12px}

.field label{
 display:block;
 font-size:13px;
 font-weight:800;
 margin-bottom:5px
}

input,textarea,select{
 width:100%;
 border:1px solid var(--border);
 border-radius:10px;
 padding:11px;
 background:#fff;
 outline:0
}

input:focus,
textarea:focus,
select:focus{
 border-color:var(--p)
}

textarea{
 min-height:95px;
 resize:vertical
}

.error{
 color:var(--danger);
 min-height:20px;
 font-size:13px;
 margin:6px 0
}

.success{
 color:var(--success);
 font-size:13px;
 margin:6px 0
}

.link{
 color:var(--p);
 font-weight:800;
 cursor:pointer
}

.welcome{
 padding:18px;
 background:linear-gradient(135deg,#eff6ff,#ecfeff)
}

.welcome h2{margin:0 0 6px}

.muted{color:var(--muted)}

.create{padding:15px}

.file{
 display:block;
 border:2px dashed #cbd5e1;
 border-radius:11px;
 padding:18px;
 text-align:center;
 color:var(--muted);
 margin:10px 0;
 cursor:pointer
}

.posthead{
 display:flex;
 gap:10px;
 align-items:center;
 padding:13px
}

.avatar{
 width:45px;
 height:45px;
 min-width:45px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--p),var(--p2));
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:900;
 overflow:hidden
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

.small{
 width:38px;
 height:38px;
 min-width:38px;
 font-size:13px
}

.user{
 font-weight:900;
 cursor:pointer
}

.meta{
 font-size:12px;
 color:var(--muted);
 margin-top:3px
}

.cat{
 margin-right:auto;
 background:#eff6ff;
 color:var(--p);
 padding:5px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:800
}

.postimg{
 width:100%;
 display:block;
 max-height:680px;
 object-fit:cover;
 background:#e2e8f0
}

.postbody{padding:12px 14px}

.postactions{
 display:flex;
 gap:17px;
 align-items:center
}

.action{
 border:0;
 background:none;
 padding:2px;
 font-size:21px
}

.liked{color:var(--danger)}

.caption{
 font-size:14px;
 line-height:1.7;
 margin-top:7px
}

.comments{
 border-top:1px solid var(--border);
 padding:12px 14px
}

.comment{
 font-size:13px;
 margin-bottom:8px;
 display:flex;
 gap:6px;
 align-items:flex-start
}

.comment b{margin-left:5px;white-space:nowrap}

.commentform{
 display:flex;
 gap:8px;
 margin-top:10px
}

.commentform button{
 border:0;
 background:none;
 color:var(--p);
 font-weight:900
}

.profile{padding:20px}

.profiletop{
 display:flex;
 gap:17px;
 align-items:center
}

.bigavatar{
 width:95px;
 height:95px;
 min-width:95px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--p),var(--p2));
 overflow:hidden;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:30px;
 font-weight:900
}

.bigavatar img{
 width:100%;
 height:100%;
 object-fit:cover
}

.pname{
 font-size:21px;
 font-weight:900
}

.verify{
 display:inline-flex;
 width:18px;
 height:18px;
 border-radius:50%;
 align-items:center;
 justify-content:center;
 background:var(--p);
 color:#fff;
 font-size:11px
}

.ownerbadge{
 display:inline-block;
 background:#dbeafe;
 color:#1d4ed8;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:900;
 margin-top:5px
}

.stats{
 display:flex;
 gap:25px;
 margin-top:12px
}

.stat{text-align:center}

.stat b{
 display:block;
 font-size:17px
}

.stat span{
 font-size:11px;
 color:var(--muted)
}

.bio{
 line-height:1.7;
 color:var(--muted);
 margin-top:12px
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:4px
}

.grid img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 cursor:pointer
}

.result,
.dm{
 display:flex;
 align-items:center;
 gap:10px;
 padding:13px
}

.grow{flex:1}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#fff;
 border-top:1px solid var(--border);
 z-index:30
}

.bottomin{
 max-width:720px;
 margin:auto;
 display:flex;
 justify-content:space-around
}

.bottom button{
 border:0;
 background:none;
 padding:7px 9px;
 font-size:19px
}

.bottom small{
 display:block;
 font-size:9px
}

.chat{
 min-height:70vh;
 display:flex;
 flex-direction:column
}

.chathead{
 padding:12px;
 border-bottom:1px solid var(--border);
 display:flex;
 gap:10px;
 align-items:center
}

.chatbody{
 flex:1;
 min-height:400px;
 padding:14px;
 background:#f8fafc
}

.msg{
 max-width:75%;
 padding:9px 12px;
 border-radius:15px;
 margin-bottom:8px;
 line-height:1.5;
 font-size:14px
}

.mine{
 background:var(--p);
 color:#fff;
 margin-right:auto;
 border-bottom-left-radius:4px
}

.theirs{
 background:#fff;
 border:1px solid var(--border);
 margin-left:auto;
 border-bottom-right-radius:4px
}

.chatform{
 display:flex;
 gap:8px;
 padding:9px;
 border-top:1px solid var(--border)
}

.notice{
 padding:13px;
 border-bottom:1px solid var(--border)
}

.unread{background:#eff6ff}

.empty{
 text-align:center;
 color:var(--muted);
 padding:45px 20px
}

.toast{
 position:fixed;
 bottom:78px;
 left:50%;
 transform:translateX(-50%);
 background:#172033;
 color:#fff;
 padding:10px 15px;
 border-radius:10px;
 z-index:100;
 font-size:13px;
 max-width:90%;
 text-align:center
}

.row{
 display:flex;
 gap:8px;
 align-items:center
}

.preview{
 width:100%;
 max-height:380px;
 object-fit:cover;
 border-radius:10px;
 margin:8px 0
}

.owner-panel{
 background:linear-gradient(135deg,#eff6ff,#ecfeff);
 border:1px solid #bfdbfe;
 padding:15px;
 border-radius:12px;
 margin-top:15px
}

.owner-panel h3{
 margin:0 0 8px;
 color:#1d4ed8
}

.debug{
 background:#111827;
 color:#d1d5db;
 border-radius:10px;
 padding:12px;
 font-size:11px;
 direction:ltr;
 text-align:left;
 overflow:auto;
 white-space:pre-wrap
}

/* Admin styles */
.admin-card{
 border-right:4px solid var(--p);
 padding:16px
}

.admin-stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 margin-bottom:20px
}

.admin-stat{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:16px;
 text-align:center
}

.admin-stat b{
 display:block;
 font-size:24px;
 color:var(--p)
}

.admin-stat span{
 font-size:12px;
 color:var(--muted)
}

.report-item{
 padding:14px;
 border-bottom:1px solid var(--border)
}

.report-item:last-child{border-bottom:0}

.badge{
 display:inline-block;
 padding:3px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:800
}

.badge-danger{background:#fee2e2;color:#b91c1c}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}

.banned{
 opacity:.5;
 filter:grayscale(1)
}

@media(max-width:600px){
 .hide-mobile{display:none}
 .container{margin-top:8px}
 .profiletop{align-items:flex-start}
 .cat{display:none}
 .auth{
  margin:18px 7px;
  padding:22px
 }
 .admin-stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
 <div class="head">

  <div class="logo" onclick="go('feed')">
   Lab<span>Gram</span>
  </div>

  <div class="actions" id="actions"></div>

 </div>
</header>

<main class="container" id="app"></main>

<nav class="bottom hidden" id="bottom"></nav>

<div id="toast" class="toast hidden"></div>

<script>

/* =========================================================
   LABGRAM V6 (ADMIN EDITION)
   ========================================================= */

window.onerror = function(msg, url, line, col, err) {
 document.body.innerHTML =
  '<div style="padding:20px;direction:ltr;text-align:left;font-family:monospace;font-size:13px;background:#111;color:#0f0;white-space:pre-wrap;min-height:100vh">' +
  'ERROR: ' + msg + '\nLine: ' + line + '\n' + (err && err.stack ? err.stack : '') +
  '</div>';
};

window.addEventListener('unhandledrejection', function(e){
 document.body.innerHTML =
  '<div style="padding:20px;direction:ltr;text-align:left;font-family:monospace;font-size:13px;background:#111;color:#f55;white-space:pre-wrap;min-height:100vh">' +
  'UNHANDLED PROMISE REJECTION:\n' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)) +
  '</div>';
});

const SUPABASE_URL = 'https://ualumobbhukgmjbznhea.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Rq7Jp7tlZO5ugDORHcCebQ_NZJnVXrZ';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;
let route = 'login';
let param = null;
let postFile = null;
let avatarFile = null;

const specialties = [
 'General',
 'Histopathology',
 'Microbiology',
 'Hematology',
 'Cytology',
 'Clinical Chemistry',
 'Laboratory Quality'
];

function esc(v){
 return String(v ?? '')
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#039;');
}

function ago(t){
 let s = Math.floor((Date.now() - new Date(t)) / 1000);
 if (s < 60) return 'الآن';
 if (s < 3600) return Math.floor(s / 60) + ' د';
 if (s < 86400) return Math.floor(s / 3600) + ' س';
 return Math.floor(s / 86400) + ' يوم';
}

function toast(text){
 const e = document.getElementById('toast');
 e.textContent = text;
 e.classList.remove('hidden');
 clearTimeout(window.toastTimer);
 window.toastTimer = setTimeout(() => e.classList.add('hidden'), 2500);
}

function go(r, p = null){
 route = r;
 param = p;
 postFile = null;
 avatarFile = null;
 render();
}

function initials(u){
 const name = u?.display_name || u?.full_name || u?.username || 'U';
 return esc(name.trim().slice(0, 1).toUpperCase());
}

function avatar(u, big = false){
 const cls = big ? 'bigavatar' : 'avatar';
 if (u?.avatar_url) {
  return `<div class="${cls}"><img src="${esc(u.avatar_url)}" alt=""></div>`;
 }
 return `<div class="${cls}">${initials(u)}</div>`;
}

function isOwner(){
 return me?.role === 'owner';
}

/* =========================================================
   AUTH & BOOT
   ========================================================= */

async function boot(){
 try {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
   const ok = await loadMe();
   if (ok) route = 'feed';
   else route = 'login';
  } else {
   route = 'login';
  }
  render();
  sb.auth.onAuthStateChange(async (event, session) => {
   if (session) {
    const ok = await loadMe();
    if (ok) { route = 'feed'; render(); }
    else { toast('تعذر تحميل ملف profile'); render(); }
   } else {
    me = null; route = 'login'; render();
   }
  });
 } catch (e) {
  console.error(e);
  document.getElementById('app').innerHTML = `
   <section class="card auth">
    <h2>LabGram</h2>
    <p class="error">حدث خطأ أثناء تشغيل التطبيق.</p>
    <div class="debug">${esc(e.message)}</div>
   </section>
  `;
 }
}

async function loadMe(){
 try {
  const { data: { user }, error: userError } = await sb.auth.getUser();
  if (userError) { console.error(userError); return false; }
  if (!user) { me = null; return false; }

  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (error) {
   console.error('PROFILE ERROR:', error);
   const meta = user.user_metadata || {};
   const fallback = {
    id: user.id,
    username: meta.username || (user.email || 'user').split('@')[0],
    full_name: meta.display_name || meta.full_name || '',
    avatar_url: meta.avatar_url || null,
    role: 'user'
   };
   const { data: newProfile, error: insertError } = await sb.from('profiles').insert(fallback).select('*').single();
   if (insertError) { console.error('PROFILE INSERT ERROR:', insertError); return false; }
   me = newProfile;
   return true;
  }

  if (!data) {
   const meta = user.user_metadata || {};
   const newProfile = {
    id: user.id,
    username: meta.username || (user.email || 'user').split('@')[0],
    full_name: meta.display_name || meta.full_name || '',
    avatar_url: meta.avatar_url || null,
    role: 'user'
   };
   const { data: created, error: createError } = await sb.from('profiles').insert(newProfile).select('*').single();
   if (createError) { console.error(createError); return false; }
   me = created;
   return true;
  }

  me = data;
  return true;
 } catch (e) {
  console.error(e);
  return false;
 }
}

/* =========================================================
   HEADER & NAV
   ========================================================= */

function header(){
 const a = document.getElementById('actions');
 const b = document.getElementById('bottom');
 if (!me) {
  a.innerHTML = `<button class="btn" onclick="go('login')">دخول</button>`;
  b.classList.add('hidden');
  return;
 }

 const name = me.username || me.full_name || 'User';

 a.innerHTML = `
  <button class="btn secondary hide-mobile" onclick="go('profile','${me.id}')">👤 ${esc(name)}</button>
  ${isOwner() ? `<button class="btn warning" onclick="go('admin')">⚙️</button>` : ''}
  <button class="btn secondary" onclick="logout()">خروج</button>
 `;

 b.classList.remove('hidden');
 b.innerHTML = `
 <div class="bottomin">
  <button onclick="go('feed')">🏠<small>الرئيسية</small></button>
  <button onclick="go('search')">🔎<small>بحث</small></button>
  <button onclick="go('create')">➕<small>نشر</small></button>
  <button onclick="go('messages')">💬<small>رسائل</small></button>
  <button onclick="go('notifications')">🔔<small>تنبيهات</small></button>
  ${isOwner() ? `<button onclick="go('admin')">⚙️<small>إدارة</small></button>` : ''}
 </div>
 `;
}

/* =========================================================
   LOGIN
   ========================================================= */

function loginPage(){
 document.getElementById('app').innerHTML = `
 <section class="card auth">
  <div class="authlogo">Lab<span>Gram</span></div>
  <p class="sub">مجتمع المختبرات والمهنيين الصحيين</p>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div>
  <div id="err" class="error"></div>
  <button class="btn full" onclick="login()">تسجيل الدخول</button>
  <div style="text-align:center;margin-top:17px" class="muted">ليس لديك حساب؟ <span class="link" onclick="go('register')">إنشاء حساب</span></div>
 </section>
 `;
}

async function login(){
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('pass').value;
 const err = document.getElementById('err');
 err.textContent = '';
 if (!email || !password) { err.textContent = 'أدخل البريد الإلكتروني وكلمة المرور'; return; }
 const { error } = await sb.auth.signInWithPassword({ email, password });
 if (error) { err.textContent = error.message; return; }
 toast('تم تسجيل الدخول');
}

/* =========================================================
   REGISTER
   ========================================================= */

function registerPage(){
 document.getElementById('app').innerHTML = `
 <section class="card auth">
  <div class="authlogo">Lab<span>Gram</span></div>
  <p class="sub">أنشئ ملفك المهني</p>
  <div class="field"><label>اسم المستخدم</label><input id="username" placeholder="mamon_lab"></div>
  <div class="field"><label>الاسم الكامل</label><input id="display" placeholder="اسمك الكامل"></div>
  <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"></div>
  <div class="field"><label>كلمة المرور</label><input id="pass" type="password" minlength="6" placeholder="6 أحرف على الأقل"></div>
  <div id="err" class="error"></div>
  <button class="btn full" onclick="register()">إنشاء الحساب</button>
  <div style="text-align:center;margin-top:17px" class="muted">لديك حساب؟ <span class="link" onclick="go('login')">تسجيل الدخول</span></div>
 </section>
 `;
}

async function register(){
 const username = document.getElementById('username').value.trim().toLowerCase();
 const full_name = document.getElementById('display').value.trim();
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('pass').value;
 const err = document.getElementById('err');
 err.textContent = '';
 if (!/^[a-z0-9_.-]{3,30}$/.test(username)) { err.textContent = 'اسم المستخدم يجب أن يحتوي على أحرف إنجليزية وأرقام فقط مع _ . -'; return; }
 if (password.length < 6) { err.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
 const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, full_name } } });
 if (error) { err.textContent = error.message; return; }
 if (data.session) { await loadMe(); route = 'feed'; render(); }
 else { err.textContent = 'تم إنشاء الحساب. افحص بريدك الإلكتروني لتأكيد الحساب.'; }
}

async function logout(){
 await sb.auth.signOut();
 me = null; route = 'login'; render();
}

/* =========================================================
   FEED
   ========================================================= */

async function feedPage(){
 const displayName = me.full_name || me.username || 'مستخدم';
 document.getElementById('app').innerHTML = `
 <section class="card welcome">
  <h2>مرحباً ${esc(displayName)} 👋</h2>
  <p class="muted">شارك المعرفة والخبرات مع مجتمع المختبرات والمهنيين الصحيين.</p>
  ${isOwner() ? `<div class="owner-panel"><h3>👑 Owner</h3><div>أنت مالك منصة LabGram</div></div>` : ''}
 </section>
 <section class="card create">
  <b>📸 نشر جديد</b>
  <label class="file" for="postFile">📷 اختر صورة من الهاتف</label>
  <input id="postFile" type="file" accept="image/*" class="hidden">
  <img id="postPreview" class="preview hidden">
  <select id="postCat" style="margin-bottom:9px">${specialties.map(x => `<option>${x}</option>`).join('')}</select>
  <textarea id="caption" maxlength="2000" placeholder="اكتب معلومة أو تجربة مهنية..."></textarea>
  <button class="btn" onclick="publish()" style="margin-top:8px">نشر</button>
 </section>
 <div id="feed"><div class="empty">جاري تحميل المنشورات...</div></div>
 `;

 const fileInput = document.getElementById('postFile');

  reader.readAsDataURL(postFile);
 };
 loadPosts();
}

 const { data, error } = await sb.from('posts').select(`
  id, user_id, image_url, caption, category, created_at,
  profiles(*),

  comments(id, user_id, text, created_at, profiles(*))
 `).order('created_at', { ascending: false });

 if (error) {

/* =========================================================
   STORAGE
   ========================================================= */

async function uploadImage(file){
 const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
 const path = `${me.id}/${crypto.randomUUID()}.${ext || 'jpg'}`;
 const { error } = await sb.storage.from('post-images').upload(path, file, { cacheControl: '3600', upsert: false, contentType: file.type });
 if (error) throw error;
 return sb.storage.from('post-images').getPublicUrl(path).data.publicUrl;
}

  const image_url = await uploadImage(postFile);
  const caption = document.getElementById('caption').value.trim();

  const { error } = await sb.from('posts').insert({ user_id: me.id, image_url, caption, category });
  if (error) throw error;

  go('feed');
 } catch (e) {

 }
}

   ========================================================= */

async function delPost(id, isMine){

async function delComment(commentId, postId){

/* =========================================================
   MESSAGES
   ========================================================= */

async function getConv(other){
 const { data: mineMembers } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
 const ids = (mineMembers || []).map(x => x.conversation_id);
 if (!ids.length) return null;
 const { data: otherMembers } = await sb.from('conversation_members').select('conversation_id').in('conversation_id', ids).eq('user_id', other);
 const cid = otherMembers?.[0]?.conversation_id;
 if (!cid) return null;
 const { data: c } = await sb.from('conversations').select('*').eq('id', cid).maybeSingle();
 return c;
}

async function startChat(other){
 try {
  let c = await getConv(other);
  if (!c) {
   const { data: n, error } = await sb.from('conversations').insert({}).select().single();
   if (error) { toast(error.message); return; }
   c = n;
   const { error: e } = await sb.from('conversation_members').insert([
    { conversation_id: c.id, user_id: me.id },
    { conversation_id: c.id, user_id: other }
   ]);
   if (e) { toast(e.message); return; }
  }
  go('chat', c.id);
 } catch (e) { toast(e.message); }
}

async function messagesPage(){
 const { data: cm } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
 const ids = (cm || []).map(x => x.conversation_id);
 if (!ids.length) {
  document.getElementById('app').innerHTML = `<div class="empty">لا توجد محادثات.<br><br>ابحث عن مستخدم وابدأ محادثة.</div>`;
  return;
 }
 const { data: cs, error } = await sb.from('conversations').select(`
  id, created_at,
  conversation_members(user_id, profiles(*)),
  messages(text, created_at, sender_id)
 `).in('id', ids).order('created_at', { ascending: false });

 if (error) {
  document.getElementById('app').innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  return;
 }

 document.getElementById('app').innerHTML = `
 <h2>💬 الرسائل</h2>
 <section class="card">
  ${(cs || []).map(c => {
   const member = c.conversation_members?.find(x => x.user_id !== me.id);
   const o = member?.profiles;
   if (o?.blocked) return ''; // Hide conversations with banned users
   const messages = (c.messages || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
   const last = messages[0];
   return `
    <div class="dm" onclick="go('chat','${c.id}')">
     ${avatar(o)}
     <div class="grow">
      <div class="user">${esc(o?.username || o?.full_name || 'User')}</div>
      <div class="meta">${esc(last?.text || 'ابدأ المحادثة')}</div>
     </div>
     <div class="meta">${last ? ago(last.created_at) : ''}</div>
    </div>
   `;
  }).join('') || '<div class="empty">لا توجد محادثات.</div>'}
 </section>
 `;
}

async function sendMsg(e, id){

 const { error } = await sb.from('messages').insert({ conversation_id: id, sender_id: me.id, text });

 else chatPage(id);

 </div>

 <section class="card admin-card">
  <h3>🚩 البلاغات</h3>
  ${reportsError ? `<div class="error">${esc(reportsError.message)}</div>` : ''}
  ${(reports || []).length ? (reports || []).map(r => {
   const post = r.posts;
   const reporter = r.profiles;
   return `
    <div class="report-item">
     <div class="row" style="margin-bottom:6px">
      <span class="badge badge-warning">بلاغ</span>
      <span class="meta">${ago(r.created_at)}</span>
     </div>
     <div style="margin-bottom:6px">
      <b>المرسل:</b> 
      <span class="link" onclick="go('profile','${r.reporter_id}')">${esc(reporter?.username || reporter?.full_name || 'مستخدم')}</span>
     </div>
     <div style="margin-bottom:6px"><b>السبب:</b> ${esc(r.reason)}</div>
     ${post ? `
      <div style="margin-bottom:8px">
       <b>المنشور:</b> ${esc(post.caption?.substring(0, 60) || 'لا يوجد وصف')}...
       <div style="margin-top:6px">
        <img src="${esc(post.image_url)}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="go('post',${post.id})">
       </div>
      </div>
      <div class="row">
       <button class="btn danger" onclick="adminDeletePost(${post.id})">حذف المنشور</button>
       <button class="btn secondary" onclick="go('profile','${post.profiles?.id}')">عرض المستخدم</button>
      </div>
     ` : '<div class="muted">المنشور محذوف</div>'}
    </div>
   `;
  }).join('') : '<div class="empty">لا توجد بلاغات.</div>'}
 </section>

 <section class="card admin-card" style="margin-top:15px">
  <h3>🔧 أدوات سريعة</h3>
  <div class="row" style="flex-wrap:wrap;gap:10px">
   <button class="btn" onclick="go('search')">🔎 البحث عن مستخدم</button>
   <button class="btn secondary" onclick="loadPosts()">🔄 تحديث المنشورات</button>
  </div>
 </section>
 `;
}

async function adminDeletePost(postId){
 if (!confirm('حذف المنشور نهائياً؟')) return;
 const { error } = await sb.from('posts').delete().eq('id', postId);
 if (error) toast(error.message);
 else { toast('تم حذف المنشور'); adminPage(); }
}

/* =========================================================
   ROUTER
   ========================================================= */

async function render(){
 header();
 if (!me) {
  if (route === 'register') registerPage();
  else loginPage();
  return;
 }
 if (route === 'feed') await feedPage();
 else if (route === 'create') await feedPage();
 else if (route === 'profile') await profilePage(param);
 else if (route === 'search') await searchPage();
 else if (route === 'messages') await messagesPage();
 else if (route === 'chat') await chatPage(param);
 else if (route === 'notifications') await notificationsPage();
 else if (route === 'post') await postPage(param);
 else if (route === 'admin') await adminPage();
 else await feedPage();
}

/* =========================================================
   START
   ========================================================= */

boot();

</script>

</body>
</html>
