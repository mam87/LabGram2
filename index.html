<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LabGram — مجتمع المختبرات</title>
<meta name="description" content="LabGram — الشبكة الاجتماعية لأخصائيي المختبرات والمهنيين الصحيين">
<meta name="theme-color" content="#6d5dfc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5dfc'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M26 14h12M28 14v14L18 46a4 4 0 0 0 3.5 6h21a4 4 0 0 0 3.5-6L36 28V14' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='29' cy='42' r='3' fill='white'/%3E%3Ccircle cx='37' cy='45' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<script src="vendor/supabase-js-2.117.3.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"></script>
<style>
:root{
  --bg:#f3f4fb; --text:#141a2e; --muted:#69708a; --line:rgba(20,26,46,.08);
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.75);
  --input:rgba(255,255,255,.75); --hover:rgba(109,93,252,.08);
  --brand:#6d5dfc; --brand2:#06b6d4; --pink:#ec4899; --danger:#ef4444; --ok:#10b981;
  --grad:linear-gradient(135deg,#6d5dfc 0%,#8b5cf6 40%,#06b6d4 100%);
  --shadow:0 1px 2px rgba(20,26,46,.04),0 12px 32px -12px rgba(40,40,110,.18);
  --shadow-lg:0 30px 60px -20px rgba(40,40,110,.30);
  --blob-o:.55; --dot:rgba(20,26,46,.10);
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070b18; --text:#eef1ff; --muted:#9aa3c0; --line:rgba(255,255,255,.08);
    --glass:rgba(20,26,50,.55); --glass-strong:rgba(22,28,54,.88); --glass-line:rgba(255,255,255,.08);
    --input:rgba(255,255,255,.05); --hover:rgba(139,124,255,.12);
    --shadow:0 1px 2px rgba(0,0,0,.2),0 16px 40px -16px rgba(0,0,0,.6);
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);
    --blob-o:.35; --dot:rgba(255,255,255,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070b18; --text:#eef1ff; --muted:#9aa3c0; --line:rgba(255,255,255,.08);
  --glass:rgba(20,26,50,.55); --glass-strong:rgba(22,28,54,.88); --glass-line:rgba(255,255,255,.08);
  --input:rgba(255,255,255,.05); --hover:rgba(139,124,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 16px 40px -16px rgba(0,0,0,.6);
  --shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);
  --blob-o:.35; --dot:rgba(255,255,255,.07);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- animated background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob-o);will-change:transform}
.b1{width:60vmax;height:60vmax;background:radial-gradient(circle,#8b5cf6 0,transparent 62%);top:-28vmax;right:-18vmax;animation:drift1 30s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;background:radial-gradient(circle,#06b6d4 0,transparent 62%);bottom:-30vmax;left:-18vmax;animation:drift2 36s ease-in-out infinite alternate}
.b3{width:38vmax;height:38vmax;background:radial-gradient(circle,#ec4899 0,transparent 62%);top:35%;left:30%;opacity:calc(var(--blob-o)*.6);animation:drift3 42s ease-in-out infinite alternate}
.dots{position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 20%,transparent 80%)}
@keyframes drift1{to{transform:translate(-12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(14vmax,-10vmax) scale(1.15)}}
@keyframes drift3{to{transform:translate(-10vmax,-12vmax) scale(.9)}}

/* ---------- primitives ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-line);box-shadow:var(--shadow);border-radius:var(--r)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:14px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .2s,background .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px -8px rgba(109,93,252,.75)}
.btn-primary:hover{box-shadow:0 12px 28px -8px rgba(109,93,252,.9)}
.btn-ghost{background:var(--input);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:rgba(239,68,68,.1);color:var(--danger)}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:12px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--hover);color:var(--brand)}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.input{width:100%;height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--input);outline:none;font-size:15px;transition:border .2s,box-shadow .2s}
textarea.input{height:auto;min-height:110px;padding:14px 16px;resize:vertical;line-height:1.7}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(109,93,252,.15)}
.input[dir="ltr"]{text-align:left}
.msg{font-size:13.5px;min-height:20px;margin:4px 0 10px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,40px)*.42);font-family:"Readex Pro",sans-serif;box-shadow:0 0 0 2px var(--glass-strong)}
.badge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--grad);color:#fff;vertical-align:-3px;margin-inline-start:4px}
.badge svg{width:11px;height:11px;stroke-width:3}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--hover);color:var(--brand);white-space:nowrap}
.muted{color:var(--muted)}
.logo{font-family:"Readex Pro",sans-serif;font-weight:700;font-size:24px;display:inline-flex;align-items:center;gap:10px;letter-spacing:-.3px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(109,93,252,.8)}
.logo-mark svg{width:22px;height:22px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:40px;max-width:1180px;margin:auto;padding:40px 24px}
.hero h1{font-family:"Readex Pro",sans-serif;font-size:clamp(34px,4.6vw,56px);line-height:1.2;margin:26px 0 16px;letter-spacing:-1px}
.hero h1 span{background:linear-gradient(90deg,#6d5dfc,#ec4899 50%,#06b6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:18px;color:var(--muted);max-width:480px}
.hero-art{position:relative;margin-top:36px;height:230px;max-width:520px}
.hero-art svg{width:100%;height:100%}
.float-chip{position:absolute;padding:10px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;border-radius:16px;animation:bob 6s ease-in-out infinite}
.float-chip i{font-style:normal;font-size:18px}
@keyframes bob{50%{transform:translateY(-10px)}}
.auth-card{padding:34px;max-width:440px;width:100%;justify-self:center;background:var(--glass-strong);box-shadow:var(--shadow-lg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:4px;margin:22px 0 22px}
.tabs button{height:40px;border-radius:11px;font-weight:600;color:var(--muted);transition:.2s}
.tabs button.on{background:var(--glass-strong);color:var(--text);box-shadow:var(--shadow)}
.link{color:var(--brand);font-weight:600;cursor:pointer}
.pulse{animation:pulse 3s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
.orbit{animation:spin 40s linear infinite;transform-origin:260px 115px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;border-radius:0;border-width:0 0 1px;display:none}
.topbar-in{height:60px;padding:0 14px;display:flex;align-items:center;justify-content:space-between}
.shell{display:grid;grid-template-columns:250px minmax(0,620px) 300px;gap:28px;max-width:1260px;margin:auto;padding:24px 24px 60px;align-items:start}
#main{min-width:0}
.side{position:sticky;top:24px;display:flex;flex-direction:column;gap:6px;height:calc(100vh - 48px)}
.side .logo{padding:6px 10px 22px}
.nav-a{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;border-radius:16px;font-weight:600;font-size:16px;color:var(--muted);transition:.2s;position:relative}
.nav-a:hover{background:var(--hover);color:var(--text)}
.nav-a.on{background:var(--glass-strong);color:var(--text);box-shadow:var(--shadow)}
.nav-a.on svg{stroke:var(--brand)}
.dot-badge{position:absolute;inset-inline-start:30px;top:9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.side .btn-primary{margin:14px 6px 0;height:50px;border-radius:16px}
.side-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px}
.side-me .who{flex:1;min-width:0;line-height:1.3}
.side-me .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-me .who small{color:var(--muted);direction:ltr;display:block;text-align:right}
.aside{position:sticky;top:24px;display:flex;flex-direction:column;gap:18px}
.panel{padding:18px}
.panel h3{font-family:"Readex Pro",sans-serif;font-size:16px;margin-bottom:12px}
.sug{display:flex;align-items:center;gap:10px;padding:8px 0}
.sug .who{flex:1;min-width:0;line-height:1.35}
.sug .who b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .who small{color:var(--muted);font-size:12.5px}
.cat-list{display:flex;flex-wrap:wrap;gap:8px}
.foot{font-size:12px;color:var(--muted);padding:0 6px}

.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;border-radius:22px 22px 0 0;border-width:1px 0 0;display:none;padding-bottom:env(safe-area-inset-bottom)}
.bottom-in{height:64px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.bottom a{display:grid;place-items:center;height:100%;color:var(--muted);position:relative}
.bottom a.on{color:var(--brand)}
.bottom .fab{width:50px;height:50px;border-radius:17px;background:var(--grad);color:#fff;display:grid;place-items:center;margin:auto;box-shadow:0 10px 24px -8px rgba(109,93,252,.9)}
.bottom .dot-badge{inset-inline-start:auto;inset-inline-end:calc(50% - 22px);top:10px}

/* ---------- feed ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-head h2{font-family:"Readex Pro",sans-serif;font-size:24px;letter-spacing:-.3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--glass);border:1px solid var(--glass-line);color:var(--muted);transition:.2s}
.chips a:hover{color:var(--text)}
.chips a.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(109,93,252,.8)}
.composer{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:18px;cursor:pointer;transition:transform .2s}
.composer:hover{transform:translateY(-2px)}
.composer .fake{flex:1;height:44px;border-radius:14px;background:var(--input);border:1px solid var(--line);display:flex;align-items:center;padding:0 16px;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
.post{margin-bottom:18px;overflow:hidden;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.post-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.post-head .who{flex:1;min-width:0;line-height:1.35}
.post-head .who a b{font-size:15.5px}
.post-head .who small{color:var(--muted);font-size:13px;display:block}
.post-body{padding:0 18px 12px;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.post-img{position:relative;background:var(--line);cursor:pointer;user-select:none}
.post-img img{width:100%;max-height:640px;object-fit:cover}
.heart-pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.heart-pop svg{width:96px;height:96px;fill:#fff;stroke:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));animation:pop .8s ease forwards}
@keyframes pop{0%{transform:scale(0);opacity:0}30%{transform:scale(1.15);opacity:1}60%{transform:scale(1)}100%{transform:scale(1.1);opacity:0}}
.post-actions{display:flex;align-items:center;gap:4px;padding:8px 10px}
.act{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.act:hover{background:var(--hover);color:var(--text)}
.act.liked{color:var(--pink)}
.act.liked svg{fill:var(--pink);stroke:var(--pink);animation:beat .35s ease}
@keyframes beat{50%{transform:scale(1.3)}}
.act.end{margin-inline-start:auto}
.comments{border-top:1px solid var(--line);padding:14px 18px}
.cmt{display:flex;gap:10px;padding:8px 0}
.cmt .bubble{background:var(--input);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 14px;flex:1;min-width:0}
.cmt .bubble b{font-size:13.5px}
.cmt .bubble p{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
.cmt small{color:var(--muted);font-size:12px}
.cmt-form{display:flex;gap:8px;margin-top:10px}
.cmt-form .input{height:44px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.skel{height:300px;margin-bottom:18px;background:linear-gradient(90deg,var(--glass) 25%,var(--hover) 50%,var(--glass) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;margin:10px 0 30px}

/* ---------- create ---------- */
.create{padding:22px}
.drop{border:2px dashed var(--line);border-radius:18px;min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;transition:.2s;overflow:hidden;position:relative;background:var(--input)}
.drop:hover,.drop.over{border-color:var(--brand);color:var(--brand);background:var(--hover)}
.drop img{width:100%;max-height:420px;object-fit:contain;background:#000}
.drop .rm{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px}
.counter{font-size:12px;color:var(--muted);text-align:left;margin-top:-8px;margin-bottom:10px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.pick button{height:36px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--input);border:1px solid var(--line);color:var(--muted)}
.pick button.on{background:var(--grad);color:#fff;border-color:transparent}

/* ---------- profile ---------- */
.prof{overflow:hidden;margin-bottom:20px}
.cover{height:170px;position:relative}
.cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.3px);background-size:18px 18px;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.prof-main{padding:0 22px 22px}
.prof-top{display:flex;align-items:flex-end;justify-content:space-between;margin-top:-52px;position:relative;z-index:1;gap:10px}
.prof-top .av{box-shadow:0 0 0 5px var(--glass-strong),var(--shadow)}
.prof h2{font-family:"Readex Pro",sans-serif;font-size:24px;margin-top:12px;letter-spacing:-.3px}
.prof .handle{color:var(--muted);direction:ltr;text-align:right}
.prof .bio{margin-top:10px;white-space:pre-wrap}
.stats{display:flex;gap:26px;margin-top:16px}
.stats div{line-height:1.3}
.stats b{font-family:"Readex Pro",sans-serif;font-size:20px;display:block}
.stats span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:var(--line);display:block}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.tile:hover img{transform:scale(1.06)}
.tile.text{background:var(--grad);color:#fff;padding:12px;font-size:13px;line-height:1.55;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.text span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tile .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;gap:16px;font-weight:700;opacity:0;transition:.2s}
.tile:hover .ov{opacity:1}
.tile .ov svg{width:18px;height:18px;fill:#fff;stroke:#fff}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;transition:.2s}
.row:hover{background:var(--hover)}
.row .who{flex:1;min-width:0;line-height:1.4}
.row .who small{color:var(--muted);font-size:13px}
.list{padding:8px}
.notif.unread{background:var(--hover)}
.notif .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;position:absolute;bottom:-4px;left:-4px;box-shadow:0 0 0 3px var(--glass-strong)}
.notif .ic svg{width:14px;height:14px;stroke-width:2.4}
.search{position:relative;margin-bottom:16px}
.search svg{position:absolute;top:13px;right:16px;color:var(--muted)}
.search .input{padding-right:48px;height:50px;border-radius:16px}
.covers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.covers button{height:46px;border-radius:12px;border:3px solid transparent;transition:.2s}
.covers button.on{border-color:var(--text);transform:scale(1.05)}
.av-edit{display:flex;align-items:center;gap:16px;margin-bottom:18px}

/* ---------- owner / moderation ---------- */
.badge.v{background:#0ea5e9}
.post-editor{padding:0 18px 14px}
.post-editor textarea{min-height:120px}
.post-editor select{margin-top:4px}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pin-tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--brand);margin:0 18px 8px}
.pin-tag svg{width:15px;height:15px}
.act.pinned{color:var(--brand)}

.banned-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;margin-bottom:16px;border-color:rgba(239,68,68,.45);color:var(--danger);font-weight:600}
.modal{position:fixed;inset:0;z-index:90;background:rgba(5,8,20,.55);display:grid;place-items:center;padding:16px;animation:rise .2s}
.modal-box{width:100%;max-width:420px;padding:22px;background:var(--glass-strong)}
.modal-box h3{font-family:"Readex Pro",sans-serif;font-size:19px;margin-bottom:4px}
.reasons{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.reasons .btn{justify-content:flex-start}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile2{padding:16px 18px;display:block}
.tile2 span{color:var(--muted);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tile2 span svg{width:17px;height:17px}
.tile2 b{font-family:"Readex Pro",sans-serif;font-size:30px;display:block;line-height:1.35}
.tile2 small{color:var(--ok);font-weight:600;font-size:12.5px}
.tile2.warn b{color:var(--pink)}
.chart{padding:18px;margin-bottom:18px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chart-head h3{font-family:"Readex Pro",sans-serif;font-size:16px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:0}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:150px;margin-top:16px;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:100%}
.bar i{display:block;width:42%;border-radius:4px 4px 0 0;min-height:2px}
.bar-lbl{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--hover);color:var(--brand);margin-inline-start:6px;vertical-align:1px}
.pill.red{background:rgba(239,68,68,.12);color:var(--danger)}
.pill.ok{background:rgba(16,185,129,.12);color:var(--ok)}
.adm-row{flex-wrap:wrap;border-bottom:1px solid var(--line);border-radius:0}
.adm-row:last-child{border-bottom:0}
.adm-act{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:var(--grad);color:#fff;font-size:10.5px;line-height:1.4;display:grid;place-items:center;overflow:hidden;padding:5px;text-align:center}
.who small.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.adm-act{width:100%;padding-inline-start:58px}}

.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);opacity:0;z-index:100;padding:12px 20px;border-radius:16px;background:#141a2e;color:#fff;font-weight:600;font-size:14.5px;box-shadow:var(--shadow-lg);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.loading{min-height:100vh;display:grid;place-items:center}
.loading .logo-mark{width:64px;height:64px;border-radius:20px;animation:pulse 1.6s ease-in-out infinite}
.loading .logo-mark svg{width:34px;height:34px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;margin-bottom:14px}
.back:hover{color:var(--text)}

/* ---------- responsive ---------- */
@media (max-width:1180px){.shell{grid-template-columns:230px minmax(0,1fr)}.aside{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);padding:16px 12px 100px;gap:0}
  .side{display:none}.topbar,.bottom{display:block}
  .auth{grid-template-columns:1fr;padding:28px 16px;gap:10px}
  .hero{text-align:center}.hero p{margin:auto}.hero-art{display:none}
  .hero h1{margin:18px 0 8px}
  .cover{height:130px}
  .grid{gap:4px}.tile{border-radius:10px}
  .toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function hashOf(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function avGrad(id){const g=AV_GRADS[hashOf(id)%AV_GRADS.length];return `linear-gradient(135deg,${g[0]},${g[1]})`}

function ago(iso){
  const s=(new Date(iso)-Date.now())/1000, a=Math.abs(s);
  if(a<45) return 'الآن';
  if(a<3600) return rtf.format(Math.round(s/60),'minute');
  if(a<86400) return rtf.format(Math.round(s/3600),'hour');
  if(a<604800) return rtf.format(Math.round(s/86400),'day');
  return new Date(iso).toLocaleDateString('ar',{day:'numeric',month:'long',year:'numeric'});
}

const S = { user:null, me:null, followIds:new Set(), unread:0, posts:new Map(), recovery:false };

async function loadMe(){
  S.me=null; S.followIds=new Set();
  if(!S.user) return;
  const {data,error} = await sb.from('lg_profiles').select('*').eq('id',S.user.id).maybeSingle();
  if(error) throw error;
  if(!data){
    // محاولة إنشاء الملف من بيانات التسجيل
    const m=S.user.user_metadata||{};
    if(m.username && USER_RE.test(m.username)){
      const ins = await sb.from('lg_profiles').insert({id:S.user.id,username:m.username,display_name:m.display_name||'',specialty:m.specialty||'General',bio:m.bio||''}).select().maybeSingle();
      if(!ins.error) S.me=ins.data;
    }
  } else S.me=data;
  if(S.me){
    const f = await sb.from('lg_follows').select('following_id').eq('follower_id',S.me.id);
    if(!f.error) S.followIds=new Set(f.data.map(x=>x.following_id));
    refreshUnread();
  }
}
async function refreshUnread(){
  if(!S.me) return;
  const {count} = await sb.from('lg_notifications').select('id',{count:'exact',head:true}).eq('user_id',S.me.id).eq('read',false);
  S.unread=count||0;
  document.querySelectorAll('[data-unread]').forEach(el=>{el.textContent=S.unread>9?'9+':S.unread;el.classList.toggle('hidden',!S.unread)});
}

function parseHash(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  const [a='',b='']=h.split('/');
  return {a,b};
}
let routeToken=0;
async function route(){
  const tok=++routeToken;
  if(S.recovery) return renderRecovery();
  if(!S.user) return renderAuth();
  if(!S.me) return renderCompleteProfile();
  const {a,b}=parseHash();
  window.scrollTo({top:0});
  const views={
    '':()=>renderFeed('all',b), c:()=>renderFeed('all',b), following:()=>renderFeed('following'),
    explore:()=>renderExplore(b), new:renderCreate, notifications:renderNotifications,
    u:()=>renderProfile(b), p:()=>renderPost(b), settings:renderSettings, admin:()=>renderAdmin(b),
  };
  (views[a]||views[''])(tok);
}

function setMsg(t,ok=false){const m=$('#fMsg');if(m){m.textContent=t;m.className='msg '+(ok?'ok':'err')}}
function busy(on,label){const b=$('#fBtn');if(!b)return;b.disabled=on;if(on){b.dataset.l=b.innerHTML;b.innerHTML='<span class="spin"></span>'}else if(b.dataset.l)b.innerHTML=label||b.dataset.l}
function authErr(e){
  const m=e?.message||'';
  if(/Invalid login/i.test(m)) return 'البريد أو كلمة المرور غير صحيحة';
  if(/not confirmed/i.test(m)) return 'لم يتم تفعيل البريد بعد — افتح رسالة التفعيل في بريدك';
  if(/already registered|already been registered/i.test(m)) return 'هذا البريد مسجّل مسبقاً، جرّب تسجيل الدخول';
  if(/rate limit|security purposes/i.test(m)) return 'محاولات كثيرة، انتظر قليلاً ثم حاول مجدداً';
  if(/Password should|weak/i.test(m)) return PASS_MSG;
  return 'خطأ: '+m;
}
async function doLogin(){
  const email=$('#fEmail').value.trim(), pass=$('#fPass').value;
  if(!email||!pass) return setMsg('أدخل البريد وكلمة المرور');
  busy(true);
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  busy(false);
  if(error) return setMsg(authErr(error));
}
async function doRegister(){
  const username=$('#fUser').value.trim().toLowerCase(), display=$('#fName').value.trim(), specialty=$('#fSpec').value;
  const email=$('#fEmail').value.trim(), pass=$('#fPass').value;
  if(!USER_RE.test(username)) return setMsg('اسم المستخدم 3–30 حرفاً إنجليزياً أو أرقاماً أو _ .');
  if(!display) return setMsg('أدخل اسمك الكامل');
  if(!email) return setMsg('أدخل البريد الإلكتروني');
  if(!passOk(pass)) return setMsg(PASS_MSG);
  busy(true);
  const chk=await sb.rpc('lg_username_available',{u:username});
  if(chk.error && isSetupError(chk.error)){busy(false);return renderSetup(chk.error)}
  if(chk.data===false){busy(false);return setMsg('اسم المستخدم محجوز، اختر اسماً آخر')}
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{
    data:{username,display_name:display,specialty,bio:''},
    emailRedirectTo:location.origin+location.pathname
  }});
  busy(false);
  if(error) return setMsg(authErr(error));
  if(!data.session){
    setMsg('✅ تم إنشاء الحساب! أرسلنا رابط تفعيل إلى بريدك — افتحه ثم سجّل الدخول.',true);
    $('#fBtn').disabled=true;
  }
}
async function doForgot(){
  const email=$('#fEmail').value.trim();
  if(!email) return setMsg('أدخل البريد الإلكتروني');
  busy(true);
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  busy(false);
  if(error) return setMsg(authErr(error));
  setMsg('✅ إن كان البريد مسجلاً فستصلك رسالة خلال دقائق.',true);
}

/* =====================================================================
   POSTS
   ===================================================================== */
const POST_SEL='id,body,image_url,category,created_at,edited_at,user_id,pinned,author:lg_profiles!lg_posts_user_id_fkey(id,username,display_name,avatar_url,specialty,role,verified),lg_likes(user_id),lg_comments(count)';
function norm(p){
  p.likeSet=new Set((p.lg_likes||[]).map(l=>l.user_id));
  p.cCount=p.lg_comments?.[0]?.count||0;
  S.posts.set(p.id,p); return p;
}
function canDelete(p){return p.user_id===S.me.id || S.me.role==='owner'}

function postCard(p,i=0){
  const a=p.author||{}, liked=p.likeSet.has(S.me.id), c=cat(p.category);
  const href='#/u/'+encodeURIComponent(a.username||'');
  return `
  <article class="post glass" id="post-${p.id}" style="animation-delay:${Math.min(i,6)*50}ms">
    <div class="post-head">
      <a href="${href}">${avatar(a,44)}</a>
      <div class="who"><a href="${href}"><b>${esc(nameOf(a))}</b>${badge(a)}</a><small><span dir="ltr">@${esc(a.username)}</span> · ${ago(p.created_at)}${p.edited_at?` · <span title="${esc(new Date(p.edited_at).toLocaleString('ar'))}">عُدِّل</span>`:''}</small></div>
      <a class="chip" href="#/c/${encodeURIComponent(c.k)}">${c.e} ${c.ar}</a>
    </div>
    ${p.pinned?`<div class="pin-tag">${ic('pin')} منشور مثبّت</div>`:''}
    ${p.body?`<div class="post-body">${esc(p.body)}</div>`:''}
    <div class="post-editor hidden"></div>
    ${p.image_url?`<div class="post-img" ondblclick="dblLike('${p.id}',this)"><img src="${esc(p.image_url)}" alt="" loading="lazy"></div>`:''}
    <div class="post-actions">
      <button class="act ${liked?'liked':''}" id="like-${p.id}" onclick="toggleLike('${p.id}')">${ic('heart')}<span>${fmt(p.likeSet.size)}</span></button>
      <a class="act" href="#/p/${p.id}">${ic('chat')}<span>${fmt(p.cCount)}</span></a>
      <button class="act" onclick="sharePost('${p.id}')" title="مشاركة">${ic('share')}</button>
      <span style="flex:1"></span>
      ${isOwner()?`<button class="act ${p.pinned?'pinned':''}" onclick="togglePin('${p.id}')" title="${p.pinned?'إلغاء التثبيت':'تثبيت أعلى الصفحة'}">${ic('pin')}</button>`:''}
      ${p.user_id!==S.me.id?`<button class="act" onclick="openReport('${p.id}')" title="إبلاغ">${ic('flag')}</button>`:''}
      ${p.user_id===S.me.id?`<button class="act" onclick="startEdit('${p.id}')" title="تعديل">${ic('pencil')}</button>`:''}
      ${canDelete(p)?`<button class="act" onclick="deletePost('${p.id}')" title="حذف">${ic('trash')}</button>`:''}
    </div>
  </article>`;
}

/* ---------- edit post (author only; enforced by the database) ---------- */
function startEdit(id){
  const p=S.posts.get(id), card=document.getElementById('post-'+id); if(!p||!card) return;
  const ed=card.querySelector('.post-editor');
  card.querySelector('.post-body')?.classList.add('hidden');
  card.querySelector('.post-actions').classList.add('hidden');
  ed.classList.remove('hidden');
  ed.innerHTML=`<label class="sr" for="edit-${id}">نص المنشور</label>
    <textarea class="input" id="edit-${id}" maxlength="2000" oninput="this.nextElementSibling.textContent=this.value.length+' / 2000'">${esc(p.body)}</textarea>
    <div class="counter">${p.body.length} / 2000</div>
    <label class="sr" for="editcat-${id}">القسم</label>
    <select class="input" id="editcat-${id}">${CATS.map(c=>`<option value="${c.k}" ${c.k===p.category?'selected':''}>${c.e} ${c.ar}</option>`).join('')}</select>
    <div class="edit-actions"><button class="btn btn-ghost btn-sm" onclick="cancelEdit('${id}')">إلغاء</button><button class="btn btn-primary btn-sm" id="editsave-${id}" onclick="saveEdit('${id}')">حفظ التعديل</button></div>`;
  const ta=ed.querySelector('textarea'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
}
function cancelEdit(id){
  const card=document.getElementById('post-'+id); if(!card) return;
  const ed=card.querySelector('.post-editor'); ed.classList.add('hidden'); ed.innerHTML='';
  card.querySelector('.post-body')?.classList.remove('hidden');
  card.querySelector('.post-actions').classList.remove('hidden');
}
async function saveEdit(id){
  const p=S.posts.get(id); if(!p) return;
  const body=$('#edit-'+id).value.trim(), category=$('#editcat-'+id).value;
  if(!body && !p.image_url) return toast('لا يمكن ترك المنشور فارغاً');
  if(body===p.body && category===p.category) return cancelEdit(id);
  const b=$('#editsave-'+id); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const {data,error}=await sb.from('lg_posts').update({body,category}).eq('id',id).select(POST_SEL).maybeSingle();
  if(error || !data){ b.disabled=false; b.textContent='حفظ التعديل'; return fail(error||{message:'not allowed'},'تعذّر حفظ التعديل') }
  const card=document.getElementById('post-'+id), comments=card?.querySelector('.comments');
  if(card){ card.outerHTML=postCard(norm(data)); if(comments) document.getElementById('post-'+id).appendChild(comments) }
  toast('تم حفظ التعديل ✓');
}

async function toggleLike(id){
  const p=S.posts.get(id); if(!p) return;
  const had=p.likeSet.has(S.me.id);
  had?p.likeSet.delete(S.me.id):p.likeSet.add(S.me.id);
  paintLike(p);
  const q = had ? sb.from('lg_likes').delete().eq('post_id',id).eq('user_id',S.me.id)
                : sb.from('lg_likes').insert({post_id:id,user_id:S.me.id});
  const {error}=await q;
  if(error && error.code!=='23505'){ had?p.likeSet.add(S.me.id):p.likeSet.delete(S.me.id); paintLike(p); fail(error,'تعذّر تسجيل الإعجاب'); }
}
function paintLike(p){
  const b=document.getElementById('like-'+p.id); if(!b) return;
  b.classList.toggle('liked',p.likeSet.has(S.me.id));
  b.querySelector('span').textContent=fmt(p.likeSet.size);
}
function dblLike(id,el){
  const pop=document.createElement('div'); pop.className='heart-pop'; pop.innerHTML=`<svg viewBox="0 0 24 24">${P.heart}</svg>`;
  el.appendChild(pop); setTimeout(()=>pop.remove(),850);
  const p=S.posts.get(id); if(p && !p.likeSet.has(S.me.id)) toggleLike(id);
}
async function sharePost(id){
  const url=location.origin+location.pathname+'#/p/'+id;
  try{ if(navigator.share) await navigator.share({title:'LabGram',url}); else {await navigator.clipboard.writeText(url); toast('تم نسخ الرابط 🔗')} }catch(e){}
}
async function deletePost(id){
  if(!confirm('حذف هذا المنشور نهائياً؟')) return;
  const p=S.posts.get(id);
  const {error}=await sb.from('lg_posts').delete().eq('id',id);
  if(error) return fail(error,'تعذّر الحذف');
  if(p?.image_url){
    const path=p.image_url.split('/'+BUCKET+'/')[1];
    if(path && path.startsWith(S.me.id)) sb.storage.from(BUCKET).remove([decodeURIComponent(path)]);
  }
  S.posts.delete(id);
  const el=document.getElementById('post-'+id);
  if(parseHash().a==='p') location.hash='#/'; else if(el){el.style.transition='.3s';el.style.opacity=0;el.style.transform='scale(.97)';setTimeout(()=>el.remove(),300)}
  toast('تم حذف المنشور');
}

let feedState={};
async function renderFeed(mode,catKey,tok){
  if(typeof catKey==='number'){tok=catKey;catKey=''}
  tok = tok ?? routeToken;
  const active = mode==='following'?'following':'feed';
  const chips=`<div class="chips"><a href="#/" class="${!catKey&&mode==='all'?'on':''}">الكل</a><a href="#/following" class="${mode==='following'?'on':''}">👥 أتابعهم</a>${CATS.map(c=>`<a href="#/c/${encodeURIComponent(c.k)}" class="${catKey===c.k?'on':''}">${c.e} ${c.ar}</a>`).join('')}</div>`;
  shell(active,`
    <div class="page-head"><h2>${mode==='following'?'من تتابعهم':catKey?cat(catKey).e+' '+cat(catKey).ar:'الرئيسية'}</h2></div>
    ${chips}
    <a class="composer glass" href="#/new">${avatar(S.me,42)}<div class="fake">شارك حالة، صورة مجهرية أو معلومة…</div><span class="icon-btn" style="color:var(--brand)">${ic('image')}</span></a>
    <div id="feed"><div class="skel glass"></div><div class="skel glass"></div></div>
    <div class="more" id="more"></div>`);
  feedState={mode,catKey,offset:0,done:false,tok,showPinned:mode==='all'&&!catKey};
  await loadFeed();
}
async function loadFeed(){
  const st=feedState, box=$('#feed'); if(!box) return;
  let q=sb.from('lg_posts').select(POST_SEL).order('created_at',{ascending:false}).range(st.offset,st.offset+PAGE-1);
  if(st.catKey) q=q.eq('category',st.catKey);
  if(st.mode==='following'){
    const ids=[...S.followIds, S.me.id];
    q=q.in('user_id',ids);
  }
  if(st.showPinned) q=q.eq('pinned',false);
  const first=st.offset===0;
  const [{data,error},pin]=await Promise.all([
    q,
    first&&st.showPinned ? sb.from('lg_posts').select(POST_SEL).eq('pinned',true).order('created_at',{ascending:false}).limit(3) : Promise.resolve({data:[]}),
  ]);
  if(stale(st.tok)) return;
  if(error) return fail(error,'تعذّر تحميل المنشورات');
  if(first) box.innerHTML=(pin.data||[]).map(norm).map(postCard).join('');
  const posts=data.map(norm);
  if(!posts.length && first && !(pin.data||[]).length){
    box.innerHTML = st.mode==='following' && S.followIds.size===0
      ? `<div class="empty glass"><div class="big">👥</div><b>لا تتابع أحداً بعد</b><p>اكتشف زملاءك وابدأ بمتابعتهم.</p><a class="btn btn-primary" style="margin-top:14px" href="#/explore">استكشاف</a></div>`
      : `<div class="empty glass"><div class="big">🧪</div><b>لا توجد منشورات بعد</b><p>كن أول من يشارك في هذا القسم.</p><a class="btn btn-primary" style="margin-top:14px" href="#/new">انشر الآن</a></div>`;
  } else box.insertAdjacentHTML('beforeend',posts.map(postCard).join(''));
  st.offset+=posts.length; st.done=posts.length<PAGE;
  $('#more').innerHTML = st.done ? (st.offset>0?'<span class="muted" style="font-size:13px">وصلت إلى النهاية ✨</span>':'') : `<button class="btn btn-ghost" onclick="this.disabled=true;loadFeed()">عرض المزيد</button>`;
}

  ]);

function cmtHTML(c,post){
  const a=c.author||{}, can=c.user_id===S.me.id||S.me.role==='owner'||post?.user_id===S.me.id;
  return `<div class="cmt" id="c-${c.id}"><a href="#/u/${encodeURIComponent(a.username||'')}">${avatar(a,34)}</a>
    <div style="flex:1;min-width:0"><div class="bubble"><a href="#/u/${encodeURIComponent(a.username||'')}"><b>${esc(nameOf(a))}</b>${badge(a)}</a><p>${esc(c.body)}</p></div>
    <small>${ago(c.created_at)}${can?` · <span class="link" style="font-weight:500" onclick="delComment('${c.id}','${c.post_id||post.id}')">حذف</span>`:''}</small></div></div>`;
}
async function addComment(e,postId){
  e.preventDefault();
  const inp=$('#cIn'), body=inp.value.trim(); if(!body) return;
  $('#cBtn').disabled=true;
  const {data,error}=await sb.from('lg_comments').insert({post_id:postId,user_id:S.me.id,body}).select('id,body,created_at,user_id,post_id').single();
  $('#cBtn').disabled=false;
  if(error) return fail(error,'تعذّر نشر التعليق');
  data.author=S.me; inp.value='';
  $('#noc')?.remove();
  $('#clist').insertAdjacentHTML('beforeend',cmtHTML(data,S.posts.get(postId)));
  const p=S.posts.get(postId); if(p){p.cCount++; const a=document.querySelector(`#post-${postId} a.act span`); if(a) a.textContent=fmt(p.cCount)}
}
async function delComment(id,postId){
  if(!confirm('حذف التعليق؟')) return;
  const {error}=await sb.from('lg_comments').delete().eq('id',id);
  if(error) return fail(error,'تعذّر الحذف');
  $('#c-'+id)?.remove();
  const p=S.posts.get(postId); if(p){p.cCount=Math.max(0,p.cCount-1); const a=document.querySelector(`#post-${postId} a.act span`); if(a) a.textContent=fmt(p.cCount)}
}

function pickCat(b){draft.cat=b.dataset.k;document.querySelectorAll('#pick button').forEach(x=>x.classList.toggle('on',x===b))}
function setFile(f){
  if(!f) return; if(!f.type.startsWith('image/')) return toast('اختر ملف صورة');
  draft.file=f;
  const url=URL.createObjectURL(f);
  $('#drop').innerHTML=`<img src="${url}" alt=""><button class="icon-btn rm" onclick="event.stopPropagation();clearFile()">${ic('x')}</button>`;
}
function clearFile(){draft.file=null;$('#file').value='';$('#drop').innerHTML=`<div>${ic('image')}<div style="margin-top:6px;font-weight:600">أضف صورة (اختياري)</div><div style="font-size:13px">اسحبها هنا أو اضغط للاختيار</div></div>`}

async function compress(file,max=1600){
  if(file.type==='image/gif' || file.size<350*1024) return file;
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
  const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
  return blob && blob.size<file.size ? new File([blob],'img.jpg',{type:'image/jpeg'}) : file;
}
async function upload(file,folder='posts'){
  const f=await compress(file);
  if(f.size>5*1024*1024) throw new Error('الصورة أكبر من 5MB');
  const ext=(f.type.split('/')[1]||'jpg').replace('jpeg','jpg');
  const path=`${S.me.id}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,cacheControl:'31536000'});
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function publish(){
  const body=$('#body').value.trim();
  if(!body && !draft.file) return toast('اكتب شيئاً أو أضف صورة');
  const b=$('#pubBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> جارٍ النشر…';
  try{
    const image_url = draft.file ? await upload(draft.file) : null;
    const {error}=await sb.from('lg_posts').insert({user_id:S.me.id,body,image_url,category:draft.cat});
    if(error) throw error;
    toast('تم النشر 🎉'); location.hash='#/';
  }catch(e){
    b.disabled=false; b.textContent='نشر';
    if(isSetupError(e)) return renderSetup(e);
    console.error(e); toast(/Bucket not found/i.test(e.message)?'مخزن الصور غير مجهز — شغّل schema.sql':'تعذّر النشر: '+(e.message||''));
  }
}

async function follow(id,btn,onProfile=false){
  const was=S.followIds.has(id); btn.disabled=true;
  const {error}= was ? await sb.from('lg_follows').delete().eq('follower_id',S.me.id).eq('following_id',id)
                     : await sb.from('lg_follows').insert({follower_id:S.me.id,following_id:id});
  btn.disabled=false;
  if(error && error.code!=='23505') return fail(error,'تعذّرت العملية');
  was?S.followIds.delete(id):S.followIds.add(id);
  const now=!was;
  btn.textContent = now ? (onProfile?'تتابعه ✓':'تتابعه') : 'متابعة';
  btn.classList.toggle('btn-primary',!now && onProfile); btn.classList.toggle('btn-ghost',now || !onProfile);
  const fc=$('#fcount'); if(onProfile&&fc){const n=(+fc.dataset.n||0)+(now?1:-1);fc.dataset.n=n;fc.textContent=fmt(n)}
  if(now) toast('تمت المتابعة 👥');
}

async function searchPeople(q){
  q=(q||'').trim().replace(/[,()%*\\"]/g,'').slice(0,60);
  let r=sb.from('lg_profiles').select('id,username,display_name,avatar_url,specialty,bio,role,verified').neq('id',S.me.id).limit(20);
  if(q){
    const specs=CATS.filter(c=>c.ar.includes(q)).map(c=>c.k);
    let ors=`username.ilike.%${q}%,display_name.ilike.%${q}%,specialty.ilike.%${q}%`;
    specs.forEach(s=>ors+=`,specialty.eq.${s}`);
    r=r.or(ors);
  } else r=r.order('created_at',{ascending:false});
  const {data,error}=await r;
  const box=$('#people'); if(!box) return;
  if(error) return fail(error);
  box.innerHTML = data.length ? data.map(p=>{const f=S.followIds.has(p.id);return `
    <div class="row">
      <a href="#/u/${encodeURIComponent(p.username)}">${avatar(p,48)}</a>
      <a class="who" href="#/u/${encodeURIComponent(p.username)}"><b>${esc(nameOf(p))}</b>${badge(p)}<br><small><span dir="ltr">@${esc(p.username)}</span> · ${cat(p.specialty).e} ${cat(p.specialty).ar}</small></a>
      <button class="btn ${f?'btn-ghost':'btn-primary'} btn-sm" onclick="follow('${p.id}',this)">${f?'تتابعه':'متابعة'}</button>
    </div>`}).join('') : `<div class="empty" style="padding:30px"><b>لا نتائج</b><p>جرّب كلمة أخرى.</p></div>`;
}

  $('#avFile').onchange=e=>{const f=e.target.files[0];if(!f)return;newAvatar=f;$('#avPrev').innerHTML=`<img class="av" style="--s:84px" src="${URL.createObjectURL(f)}">`};
}
async function changePass(){
  const p=$('#sPass').value, m=$('#pMsg'), b=$('#pBtn');
  if(!passOk(p)){m.className='msg err';m.textContent=PASS_MSG;return}
  b.disabled=true;
  const {error}=await sb.auth.updateUser({password:p});
  b.disabled=false;
  if(error){m.className='msg err';m.textContent=authErr(error);return}
  $('#sPass').value=''; m.className='msg ok'; m.textContent='✅ تم تحديث كلمة المرور'; toast('تم تحديث كلمة المرور ✅');
}
async function saveSettings(){
  const typed=$('#sUser').value.trim();
  const username = typed===S.me.username ? typed : typed.toLowerCase();
  if(!USER_RE.test(username)) return setMsg('اسم المستخدم 3–30 حرفاً إنجليزياً أو أرقاماً أو _ .');
  const upd={display_name:$('#sName').value.trim(),username,specialty:$('#sSpec').value,bio:$('#sBio').value.trim(),cover:document.querySelector('.covers button.on')?.dataset.k||'aurora'};
  busy(true);
  try{
    if(newAvatar==='remove') upd.avatar_url=null;
    else if(newAvatar) upd.avatar_url=await upload(newAvatar,'avatars');
    const {data,error}=await sb.from('lg_profiles').update(upd).eq('id',S.me.id).select().single();
    if(error) throw error;
    S.me=data; toast('تم الحفظ ✅'); location.hash='#/u/'+encodeURIComponent(data.username);
  }catch(e){
    busy(false);
    setMsg(e.code==='23505'?'اسم المستخدم محجوز':'تعذّر الحفظ: '+(e.message||''));
  }
}

/* =====================================================================
   REPORTS & PIN
   ===================================================================== */
const REASONS=['محتوى غير لائق','يحتوي بيانات تعريفية لمريض','إزعاج أو إعلان (سبام)','معلومة علمية خاطئة','سبب آخر'];
function openReport(id){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="modal-box glass" role="dialog" aria-label="الإبلاغ عن المنشور">
    <h3>الإبلاغ عن المنشور</h3><p class="muted" style="font-size:14px">اختر السبب، وستراجعه إدارة المنصة.</p>
    <div class="reasons">${REASONS.map(r=>`<button class="btn btn-ghost btn-block" data-r="${esc(r)}">${ic('flag')} ${esc(r)}</button>`).join('')}</div>
    <button class="btn btn-block" style="margin-top:10px" data-x="1">إلغاء</button></div>`;
  m.addEventListener('click',e=>{
    const r=e.target.closest('[data-r]');
    if(r){ m.remove(); sendReport(id,r.dataset.r); return }
    if(e.target===m || e.target.closest('[data-x]')) m.remove();
  });
  document.body.appendChild(m);
}
async function sendReport(id,reason){
  const {error}=await sb.from('lg_reports').insert({post_id:id,reporter_id:S.me.id,reason});
  if(error){ if(error.code==='23505') return toast('سبق أن أبلغت عن هذا المنشور'); return fail(error,'تعذّر إرسال البلاغ') }
  toast('شكراً لك، تم إرسال البلاغ');
}
async function togglePin(id){
  const p=S.posts.get(id); if(!p||!isOwner()) return;
  const {error}=await sb.from('lg_posts').update({pinned:!p.pinned}).eq('id',id);
  if(error) return fail(error,'تعذّر التثبيت');
  p.pinned=!p.pinned; toast(p.pinned?'تم تثبيت المنشور أعلى الرئيسية 📌':'تم إلغاء التثبيت');
  if(parseHash().a==='admin') renderAdmin('posts'); else route();
}

/* =====================================================================
   OWNER DASHBOARD
   ===================================================================== */
const ADM={users:[],emails:{},q:'',showResolved:false};
const dateAr = iso => new Date(iso).toLocaleDateString('ar',{day:'numeric',month:'short',year:'numeric'});
async function renderAdmin(tab){
  if(!isOwner()){ location.hash='#/'; return }
  tab=['overview','users','reports','posts'].includes(tab)?tab:'overview';
  const T=[['overview','نظرة عامة'],['users','المستخدمون'],['reports','البلاغات'],['posts','المنشورات']];
  shell('admin',`
    <div class="page-head"><h2>لوحة التحكم</h2><span class="chip">${ic('shield')} مالك المنصة</span></div>
    <div class="chips">${T.map(([k,l])=>`<a href="#/admin/${k}" class="${tab===k?'on':''}">${l}${k==='reports'?' <span id="repCount"></span>':''}</a>`).join('')}</div>
    <div id="adm"><div class="skel glass" style="height:220px"></div></div>`,{aside:false});
  ({overview:admOverview,users:admUsers,reports:admReports,posts:admPosts})[tab]();
  const {count}=await sb.from('lg_reports').select('id',{count:'exact',head:true}).eq('status','open');
  const rc=$('#repCount'); if(rc&&count) rc.textContent='('+fmt(count)+')';
}
const cnt=(t,f)=>{let q=sb.from(t).select('*',{count:'exact',head:true}); return f?f(q):q};

async function admOverview(){
  const start=new Date(); start.setHours(0,0,0,0);
  const today=start.toISOString(), week=new Date(Date.now()-7*864e5).toISOString();
  const since=new Date(start.getTime()-13*864e5);
  const [u,u7,p,pT,cm,lk,fo,rp,ps,us,latest]=await Promise.all([
    cnt('lg_profiles'), cnt('lg_profiles',q=>q.gte('created_at',week)),
    cnt('lg_posts'), cnt('lg_posts',q=>q.gte('created_at',today)),
    cnt('lg_comments'), cnt('lg_likes'), cnt('lg_follows'),
    cnt('lg_reports',q=>q.eq('status','open')),
    sb.from('lg_posts').select('created_at').gte('created_at',since.toISOString()),
    sb.from('lg_profiles').select('created_at').gte('created_at',since.toISOString()),
    sb.from('lg_profiles').select('id,username,display_name,avatar_url,specialty,role,verified,created_at').order('created_at',{ascending:false}).limit(5),
  ]);
  if(!$('#adm')) return;
  if(u.error) return fail(u.error);
  const days=[...Array(14)].map((_,i)=>{const d=new Date(since.getTime()+i*864e5);return {k:d.toDateString(),d:d.getDate(),p:0,u:0}});
  const idx=Object.fromEntries(days.map((d,i)=>[d.k,i]));
  (ps.data||[]).forEach(r=>{const i=idx[new Date(r.created_at).toDateString()]; if(i!=null) days[i].p++});
  (us.data||[]).forEach(r=>{const i=idx[new Date(r.created_at).toDateString()]; if(i!=null) days[i].u++});
  const max=Math.max(1,...days.map(d=>Math.max(d.p,d.u)));
  const tile=(icon,label,n,sub,cls='',href='')=>`<${href?'a href="'+href+'"':'div'} class="tile2 glass ${cls}"><span>${ic(icon)} ${label}</span><b>${fmt(n)}</b>${sub?`<small>${sub}</small>`:''}</${href?'a':'div'}>`;
  $('#adm').innerHTML=`
    <div class="tiles">
      ${tile('users','المستخدمون',u.count,u7.count?'+'+fmt(u7.count)+' هذا الأسبوع':'')}
      ${tile('image','المنشورات',p.count,pT.count?'+'+fmt(pT.count)+' اليوم':'')}
      ${tile('chat','التعليقات',cm.count)}
      ${tile('heart','الإعجابات',lk.count)}
      ${tile('user','المتابعات',fo.count)}
      ${tile('flag','بلاغات مفتوحة',rp.count,rp.count?'بحاجة لمراجعة':'',rp.count?'warn':'','#/admin/reports')}
    </div>
    <section class="chart glass">
      <div class="chart-head"><h3>النشاط في آخر 14 يوماً</h3>
        <div class="legend"><span><i style="background:var(--brand)"></i>منشورات</span><span><i style="background:var(--brand2)"></i>مستخدمون جدد</span></div></div>
      <div class="bars" role="img" aria-label="رسم بياني للمنشورات والمستخدمين الجدد يومياً">
        ${days.map(d=>`<div class="bar" title="${d.p} منشور · ${d.u} مستخدم"><i style="height:${d.p/max*100}%;background:var(--brand)"></i><i style="height:${d.u/max*100}%;background:var(--brand2)"></i></div>`).join('')}
      </div>
      <div class="bar-lbl">${days.map(d=>`<span>${d.d}</span>`).join('')}</div>
    </section>
    <section class="glass list"><div class="panel" style="padding:10px 10px 4px"><h3>أحدث المنضمين</h3></div>
      ${(latest.data||[]).map(x=>`<a class="row" href="#/u/${encodeURIComponent(x.username)}">${avatar(x,42)}<span class="who"><b>${esc(nameOf(x))}</b>${badge(x)}<br><small><span dir="ltr">@${esc(x.username)}</span> · ${dateAr(x.created_at)}</small></span></a>`).join('')||'<p class="muted" style="padding:12px">لا يوجد بعد.</p>'}
    </section>`;
}

async function admUsers(){
  $('#adm').innerHTML=`<div class="search">${ic('search')}<input class="input glass" id="uq" placeholder="ابحث بالاسم أو اسم المستخدم أو البريد…" value="${esc(ADM.q)}" autocomplete="off"></div>
    <div class="glass list" id="ul"><div class="muted" style="padding:16px">جارٍ التحميل…</div></div>`;
  $('#uq').addEventListener('input',e=>{ADM.q=e.target.value;drawUsers()});
  const [pr,em]=await Promise.all([
    sb.from('lg_profiles').select('*').order('created_at',{ascending:false}).limit(1000),
    sb.rpc('lg_admin_users'),
  ]);
  if(pr.error) return fail(pr.error);
  ADM.users=pr.data; ADM.emails=Object.fromEntries((em.data||[]).map(r=>[r.id,r]));
  drawUsers();
}
function drawUsers(){
  const box=$('#ul'); if(!box) return;
  const q=ADM.q.trim().toLowerCase();
  const list=ADM.users.filter(p=>!q||[p.username,p.display_name,ADM.emails[p.id]?.email,p.specialty].some(v=>(v||'').toLowerCase().includes(q)));
  box.innerHTML = `<div class="muted" style="padding:8px 16px;font-size:13px">${fmt(list.length)} مستخدم</div>` + (list.map(p=>{
    const e=ADM.emails[p.id], self=p.id===S.me.id;
    return `<div class="row adm-row">
      <a href="#/u/${encodeURIComponent(p.username)}">${avatar(p,46)}</a>
      <div class="who" style="min-width:0">
        <b>${esc(nameOf(p))}</b>${badge(p)}${p.role==='owner'?'<span class="pill">مالك</span>':''}${p.banned?'<span class="pill red">موقوف</span>':''}${e&&!e.confirmed?'<span class="pill red">بريد غير مفعّل</span>':''}
        <small class="ell"><span dir="ltr">@${esc(p.username)}</span> · ${cat(p.specialty).ar} · انضم ${dateAr(p.created_at)}</small>
        ${e?`<small class="ell" dir="ltr" style="text-align:right">${esc(e.email)}${e.last_sign_in_at?' · آخر دخول '+ago(e.last_sign_in_at):''}</small>`:''}
      </div>
      <div class="adm-act">
        <button class="btn btn-ghost btn-sm" onclick="admSet('${p.id}',{verified:${!p.verified}},'${p.verified?'تم إلغاء التوثيق':'تم توثيق الحساب ✓'}')">${ic('check')} ${p.verified?'إلغاء التوثيق':'توثيق'}</button>
        ${self?'':`<button class="btn ${p.banned?'btn-ghost':'btn-danger'} btn-sm" onclick="admBan('${p.id}',${!p.banned})">${ic('ban')} ${p.banned?'رفع الإيقاف':'إيقاف'}</button>
        <button class="btn btn-ghost btn-sm" onclick="admOwner('${p.id}',${p.role!=='owner'})">${ic('shield')} ${p.role==='owner'?'إزالة المالك':'جعله مالكاً'}</button>`}
      </div>
    </div>`}).join('') || '<div class="empty" style="padding:30px"><b>لا نتائج</b></div>');
}
async function admSet(id,patch,msg){
  const {error}=await sb.from('lg_profiles').update(patch).eq('id',id);
  if(error) return fail(error,'تعذّر التحديث');
  const u=ADM.users.find(x=>x.id===id); if(u) Object.assign(u,patch);
  drawUsers(); toast(msg);
}
function admBan(id,on){
  const u=ADM.users.find(x=>x.id===id);
  if(on && !confirm(`إيقاف ${nameOf(u)}؟ لن يستطيع النشر أو التعليق أو الإعجاب.`)) return;
  admSet(id,{banned:on},on?'تم إيقاف الحساب':'تم رفع الإيقاف');
}
function admOwner(id,on){
  const u=ADM.users.find(x=>x.id===id);
  if(!confirm(on?`منح ${nameOf(u)} صلاحيات المالك الكاملة (حذف المحتوى وإدارة المستخدمين)؟`:`إزالة صلاحيات المالك من ${nameOf(u)}؟`)) return;
  admSet(id,{role:on?'owner':'user'},on?'أصبح مالكاً':'تمت إزالة صلاحية المالك');
}

async function admReports(){
  const {data,error}=await sb.from('lg_reports')
    .select('id,reason,status,created_at,post_id,reporter:lg_profiles!lg_reports_reporter_id_fkey(id,username,display_name,avatar_url,role,verified),post:lg_posts(id,body,image_url,user_id,author:lg_profiles!lg_posts_user_id_fkey(username,display_name))')
    .order('created_at',{ascending:false}).limit(200);
  if(!$('#adm')) return;
  if(error) return fail(error);
  const list=data.filter(r=>ADM.showResolved||r.status==='open');
  $('#adm').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px">
      <span class="muted" style="font-size:14px">${fmt(data.filter(r=>r.status==='open').length)} بلاغ مفتوح</span>
      <button class="btn btn-ghost btn-sm" onclick="ADM.showResolved=!ADM.showResolved;admReports()">${ADM.showResolved?'إخفاء المعالجة':'عرض المعالجة أيضاً'}</button>
    </div>
    <div class="glass list">${list.map(r=>{
      const p=r.post||{}, a=p.author||{};
      return `<div class="row adm-row" id="rep-${r.id}">
        <a href="#/p/${r.post_id}">${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" alt="">`:`<span class="thumb">${esc((p.body||'').slice(0,40))}</span>`}</a>
        <div class="who" style="min-width:0">
          <b>${esc(r.reason)}</b>${r.status==='resolved'?'<span class="pill ok">تمت المعالجة</span>':''}
          <small class="ell">منشور ${esc(nameOf(a))} · أبلغ عنه ${esc(nameOf(r.reporter))} · ${ago(r.created_at)}</small>
          ${p.body?`<small class="ell">${esc(p.body.slice(0,120))}</small>`:''}
        </div>
        <div class="adm-act">
          <a class="btn btn-ghost btn-sm" href="#/p/${r.post_id}">عرض</a>
          ${r.status==='open'?`<button class="btn btn-ghost btn-sm" onclick="admResolve('${r.id}')">${ic('check')} تجاهل</button>`:''}
          <button class="btn btn-danger btn-sm" onclick="admDeleteReported('${r.post_id}')">${ic('trash')} حذف المنشور</button>
        </div>
      </div>`}).join('') || `<div class="empty"><div class="big">✅</div><b>لا توجد بلاغات مفتوحة</b><p>كل شيء نظيف.</p></div>`}</div>`;
}
async function admResolve(id){
  const {error}=await sb.from('lg_reports').update({status:'resolved'}).eq('id',id);
  if(error) return fail(error,'تعذّر التحديث');
  toast('تم تجاهل البلاغ'); admReports();
}
async function admDeleteReported(postId){
  if(!confirm('حذف هذا المنشور نهائياً؟ ستُغلق كل البلاغات المرتبطة به.')) return;
  const {error}=await sb.from('lg_posts').delete().eq('id',postId);
  if(error) return fail(error,'تعذّر الحذف');
  toast('تم حذف المنشور'); renderAdmin('reports');
}

async function admPosts(){
  const {data,error}=await sb.from('lg_posts').select(POST_SEL).order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(60);
  if(!$('#adm')) return;
  if(error) return fail(error);
  const list=data.map(norm);
  $('#adm').innerHTML=`<div class="glass list">${list.map(p=>`
    <div class="row adm-row" id="post-${p.id}">
      <a href="#/p/${p.id}">${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" alt="">`:`<span class="thumb">${esc(p.body.slice(0,40))}</span>`}</a>
      <div class="who" style="min-width:0">
        <b>${esc(nameOf(p.author))}</b>${badge(p.author)}${p.pinned?'<span class="pill">مثبّت</span>':''}
        <small class="ell">${cat(p.category).ar} · ${ago(p.created_at)} · ${fmt(p.likeSet.size)} إعجاب · ${fmt(p.cCount)} تعليق</small>
        ${p.body?`<small class="ell">${esc(p.body.slice(0,120))}</small>`:''}
      </div>
      <div class="adm-act">
        <button class="btn btn-ghost btn-sm" onclick="togglePin('${p.id}')">${ic('pin')} ${p.pinned?'إلغاء التثبيت':'تثبيت'}</button>
        <button class="btn btn-danger btn-sm" onclick="deletePost('${p.id}')">${ic('trash')} حذف</button>
      </div>
    </div>`).join('') || '<div class="empty"><b>لا توجد منشورات بعد</b></div>'}</div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function setSession(session){
  S.user=session?.user||null;
  try{ await loadMe() }catch(e){ if(isSetupError(e)) { S.setupErr=e; } else console.error(e) }
}
(async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  await setSession(session);
  if(S.setupErr) return renderSetup(S.setupErr);
  route();
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='PASSWORD_RECOVERY'){ S.recovery=true; setTimeout(route,0); return }
    if(ev==='SIGNED_IN' && s?.user?.id===S.user?.id && S.me) return;
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT'){
      setTimeout(async()=>{ S.setupErr=null; await setSession(s); if(S.setupErr) return renderSetup(S.setupErr);
        if(ev==='SIGNED_IN' && /access_token|type=/.test(location.hash)) location.hash='#/';
        route(); },0);
    }
  });
  addEventListener('hashchange',()=>{ if(/access_token|error_description/.test(location.hash)) return; route() });
  setInterval(refreshUnread,60000);
})();
</script>
