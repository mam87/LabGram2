<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><meta name="description" content="LabGram - مجتمع المختبرات والمهنيين الصحيين">
<title>LabGram</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#2563eb;--p2:#06b6d4;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--shadow:0 8px 28px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}.head{height:62px;max-width:1100px;margin:auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:900;color:var(--p);cursor:pointer}.logo span{color:var(--p2)}.actions{display:flex;gap:7px;align-items:center}.container{max-width:720px;margin:16px auto;padding:0 12px 92px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:#fff;font-weight:800}.btn.secondary{background:#eef2f7;color:var(--text)}.btn.danger{background:#fee2e2;color:#b91c1c}.full{width:100%}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:15px}.auth{max-width:420px;margin:35px auto;padding:28px}.authlogo{text-align:center;font-size:34px;font-weight:900;color:var(--p)}.authlogo span{color:var(--p2)}.sub{text-align:center;color:var(--muted);margin:8px 0 24px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;background:#fff;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--p)}textarea{min-height:95px;resize:vertical}.error{color:var(--danger);min-height:20px;font-size:13px;margin:6px 0}.link{color:var(--p);font-weight:800;cursor:pointer}.welcome{padding:18px;background:linear-gradient(135deg,#eff6ff,#ecfeff)}.welcome h2{margin:0 0 6px}.muted{color:var(--muted)}.create{padding:15px}.file{display:block;border:2px dashed #cbd5e1;border-radius:11px;padding:18px;text-align:center;color:var(--muted);margin:10px 0;cursor:pointer}.posthead{display:flex;gap:10px;align-items:center;padding:13px}.avatar{width:45px;height:45px;min-width:45px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.small{width:38px;height:38px;min-width:38px;font-size:13px}.user{font-weight:900;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-top:3px}.cat{margin-right:auto;background:#eff6ff;color:var(--p);padding:5px 8px;border-radius:20px;font-size:11px;font-weight:800}.postimg{width:100%;display:block;max-height:680px;object-fit:cover;background:#e2e8f0}.postbody{padding:12px 14px}.postactions{display:flex;gap:17px;align-items:center}.action{border:0;background:none;padding:2px;font-size:21px}.liked{color:var(--danger)}.caption{font-size:14px;line-height:1.7;margin-top:7px}.comments{border-top:1px solid var(--border);padding:12px 14px}.comment{font-size:13px;margin-bottom:8px}.comment b{margin-left:5px}.commentform{display:flex;gap:8px;margin-top:10px}.commentform button{border:0;background:none;color:var(--p);font-weight:900}.profile{padding:20px}.profiletop{display:flex;gap:17px;align-items:center}.bigavatar{width:95px;height:95px;min-width:95px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--p2));overflow:hidden;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}.bigavatar img{width:100%;height:100%;object-fit:cover}.pname{font-size:21px;font-weight:900}.verify{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;background:var(--p);color:#fff;font-size:11px}.stats{display:flex;gap:25px;margin-top:12px}.stat{text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:11px;color:var(--muted)}.bio{line-height:1.7;color:var(--muted);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}.result,.dm{display:flex;align-items:center;gap:10px;padding:13px}.grow{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30}.bottomin{max-width:720px;margin:auto;display:flex;justify-content:space-around}.bottom button{border:0;background:none;padding:7px 9px;font-size:19px}.bottom small{display:block;font-size:9px}.chat{min-height:70vh;display:flex;flex-direction:column}.chathead{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}.chatbody{flex:1;min-height:400px;padding:14px;background:#f8fafc}.msg{max-width:75%;padding:9px 12px;border-radius:15px;margin-bottom:8px;line-height:1.5;font-size:14px}.mine{background:var(--p);color:#fff;margin-right:auto;border-bottom-left-radius:4px}.theirs{background:#fff;border:1px solid var(--border);margin-left:auto;border-bottom-right-radius:4px}.chatform{display:flex;gap:8px;padding:9px;border-top:1px solid var(--border)}.notice{padding:13px;border-bottom:1px solid var(--border)}.unread{background:#eff6ff}.empty{text-align:center;color:var(--muted);padding:45px 20px}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:10px;z-index:100;font-size:13px;max-width:90%;text-align:center}.row{display:flex;gap:8px;align-items:center}.preview{width:100%;max-height:380px;object-fit:cover;border-radius:10px;margin:8px 0}.toplink{cursor:pointer;color:var(--p);font-weight:800}
@media(max-width:600px){.hide-mobile{display:none}.container{margin-top:8px}.profiletop{align-items:flex-start}.cat{display:none}.auth{margin:18px 7px;padding:22px}}
</style>
</head>
<body>
<header class="header"><div class="head"><div class="logo" onclick="go('feed')">Lab<span>Gram</span></div><div class="actions" id="actions"></div></div></header>
<main class="container" id="app"></main>
<nav class="bottom hidden" id="bottom"></nav><div id="toast" class="toast hidden"></div>
<script>
/* =========================================================
   LABGRAM V4 - SUPABASE WEB APP
   IMPORTANT: only the publishable/anon key belongs here.
   NEVER put sb_secret_* in browser code.
========================================================= */
const SUPABASE_URL='https://ualumobbhukgmjbznhea.supabase.co';
const SUPABASE_KEY='sb_publishable_Rq7Jp7tlZO5ugDORHcCebQ_NZJnVXrZ';
const {createClient}=supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,route='login',param=null,postFile=null,avatarFile=null;
const specialties=['General','Histopathology','Microbiology','Hematology','Cytology','Clinical Chemistry','Laboratory Quality'];
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const ago=t=>{let s=Math.floor((Date.now()-new Date(t))/1000);if(s<60)return'الآن';if(s<3600)return Math.floor(s/60)+' د';if(s<86400)return Math.floor(s/3600)+' س';return Math.floor(s/86400)+' يوم'};
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add('hidden'),2300)}
function go(r,p=null){route=r;param=p;postFile=null;avatarFile=null;render()}
function initials(u){return esc((u?.display_name||u?.username||'U').trim().slice(0,1).toUpperCase())}
function avatar(u,big=false){return `<div class="${big?'bigavatar':'avatar'}">${u?.avatar_url?`<img src="${esc(u.avatar_url)}" alt="">`:initials(u)}</div>`}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(session){await loadMe();route='feed'}else route='login';render();
 sb.auth.onAuthStateChange(async(_e,s)=>{if(s){await loadMe();route='feed'}else{me=null;route='login'}render()});
}
async function loadMe(){if(!sb.auth.getUser)return;const {data:{user}}=await sb.auth.getUser();if(!user){me=null;return}const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)console.error(error);me=data}
function header(){let a=document.getElementById('actions'),b=document.getElementById('bottom');if(!me){a.innerHTML=`<button class="btn" onclick="go('login')">دخول</button>`;b.classList.add('hidden');return}a.innerHTML=`<button class="btn secondary hide-mobile" onclick="go('profile','${me.id}')">👤 ${esc(me.username)}</button><button class="btn secondary" onclick="logout()">خروج</button>`;b.classList.remove('hidden');b.innerHTML=`<div class="bottomin"><button onclick="go('feed')">🏠<small>الرئيسية</small></button><button onclick="go('search')">🔎<small>بحث</small></button><button onclick="go('create')">➕<small>نشر</small></button><button onclick="go('messages')">💬<small>رسائل</small></button><button onclick="go('notifications')">🔔<small>تنبيهات</small></button></div>`}
function loginPage(){document.getElementById('app').innerHTML=`<section class="card auth"><div class="authlogo">Lab<span>Gram</span></div><p class="sub">مجتمع المختبرات والمهنيين الصحيين</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><div id="err" class="error"></div><button class="btn full" onclick="login()">تسجيل الدخول</button><div style="text-align:center;margin-top:17px" class="muted">ليس لديك حساب؟ <span class="link" onclick="go('register')">إنشاء حساب</span></div><div style="margin-top:20px;padding:11px;background:#f8fafc;border-radius:9px;font-size:12px" class="muted">التسجيل الحقيقي يعمل عبر Supabase Auth.</div></section>`}
function registerPage(){document.getElementById('app').innerHTML=`<section class="card auth"><div class="authlogo">Lab<span>Gram</span></div><p class="sub">أنشئ ملفك المهني</p><div class="field"><label>اسم المستخدم</label><input id="username" placeholder="mamon_lab"></div><div class="field"><label>الاسم الظاهر</label><input id="display" placeholder="اسمك الكامل"></div><div class="field"><label>التخصص</label><select id="specialty">${specialties.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>نبذة</label><textarea id="bio" maxlength="500" placeholder="اكتب نبذة عنك وخبرتك..."></textarea></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" minlength="6" placeholder="6 أحرف على الأقل"></div><div id="err" class="error"></div><button class="btn full" onclick="register()">إنشاء الحساب</button><div style="text-align:center;margin-top:17px" class="muted">لديك حساب؟ <span class="link" onclick="go('login')">دخول</span></div></section>`}
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;let {error}=await sb.auth.signInWithPassword({email,password});if(error)document.getElementById('err').textContent=error.message;else toast('تم تسجيل الدخول')}
async function register(){let username=document.getElementById('username').value.trim().toLowerCase(),display_name=document.getElementById('display').value.trim()||username,bio=document.getElementById('bio').value.trim(),specialty=document.getElementById('specialty').value,email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!/^[a-z0-9_.-]{3,30}$/.test(username)){document.getElementById('err').textContent='اسم المستخدم: أحرف إنجليزية وأرقام و _ . - فقط';return}let {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name,bio,specialty}}});if(error){document.getElementById('err').textContent=error.message;return}if(data.session){await loadMe();route='feed';render()}else{document.getElementById('err').textContent='تم إنشاء الحساب. افحص بريدك الإلكتروني لتأكيد الحساب.'}}
async function logout(){await sb.auth.signOut();me=null;go('login')}
async function feedPage(){document.getElementById('app').innerHTML=`<section class="card welcome"><h2>مرحباً ${esc(me.display_name)} 👋</h2><p class="muted">شارك المعرفة والخبرات مع مجتمع المختبرات والمهنيين الصحيين.</p></section><section class="card create"><b>📸 نشر جديد</b><label class="file" for="postFile">📷 اختر صورة من الهاتف</label><input id="postFile" type="file" accept="image/*" class="hidden"><img id="postPreview" class="preview hidden"><select id="postCat" style="margin-bottom:9px">${specialties.map(x=>`<option>${x}</option>`).join('')}</select><textarea id="caption" maxlength="2000" placeholder="اكتب معلومة أو تجربة مهنية..."></textarea><button class="btn" onclick="publish()" style="margin-top:8px">نشر</button></section><div id="feed"><div class="empty">جاري تحميل المنشورات...</div></div>`;document.getElementById('postFile').onchange=e=>{postFile=e.target.files[0];if(postFile){if(postFile.size>8*1024*1024){toast('الصورة يجب أن تكون أقل من 8MB');postFile=null;e.target.value='';return}let r=new FileReader();r.onload=()=>{let p=document.getElementById('postPreview');p.src=r.result;p.classList.remove('hidden')};r.readAsDataURL(postFile)}};loadPosts()}
async function loadPosts(){let {data,error}=await sb.from('posts').select('id,user_id,image_url,caption,category,created_at,profiles!posts_user_id_fkey(id,username,display_name,bio,specialty,avatar_url,verified,blocked),likes(user_id),comments(id,user_id,text,created_at,profiles!comments_user_id_fkey(username,display_name,avatar_url))').order('created_at',{ascending:false});if(error){document.getElementById('feed').innerHTML=`<div class="empty">تعذر تحميل المنشورات.<br>${esc(error.message)}</div>`;return}data=(data||[]).filter(p=>!p.profiles?.blocked);document.getElementById('feed').innerHTML=data.length?data.map(postHTML).join(''):`<div class="empty">لا توجد منشورات بعد. كن أول من ينشر!</div>`}
function postHTML(p){let liked=(p.likes||[]).some(x=>x.user_id===me.id);return `<article class="card"><div class="posthead">${avatar(p.profiles)}<div class="grow"><div class="user" onclick="go('profile','${p.user_id}')">${esc(p.profiles?.username||'user')} ${p.profiles?.verified?'<span class="verify">✓</span>':''}</div><div class="meta">${ago(p.created_at)}</div></div><div class="cat">${esc(p.category)}</div></div>${p.image_url?`<img class="postimg" src="${esc(p.image_url)}" alt="LabGram">`:''}<div class="postbody"><div class="postactions"><button class="action ${liked?'liked':''}" onclick="like(${p.id},${liked})">${liked?'♥':'♡'} ${(p.likes||[]).length}</button><button class="action" onclick="document.getElementById('c${p.id}').focus()">💬 ${(p.comments||[]).length}</button><button class="action" onclick="report(${p.id})">🚩</button>${p.user_id===me.id?`<button class="action" onclick="delPost(${p.id})">🗑️</button>`:''}</div>${p.caption?`<div class="caption"><b>${esc(p.profiles?.username||'')}</b> ${esc(p.caption)}</div>`:''}</div><div class="comments">${(p.comments||[]).slice(-5).map(c=>`<div class="comment"><b>${esc(c.profiles?.username||'user')}</b>${esc(c.text)}</div>`).join('')||'<div class="meta">لا توجد تعليقات بعد.</div>'}<form class="commentform" onsubmit="comment(event,${p.id})"><input id="c${p.id}" maxlength="500" placeholder="اكتب تعليقاً..."><button>نشر</button></form></div></article>`}
async function uploadImage(file,folder){let ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');let path=`${me.id}/${crypto.randomUUID()}.${ext||'jpg'}`;let {error}=await sb.storage.from('post-images').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(error)throw error;return sb.storage.from('post-images').getPublicUrl(path).data.publicUrl}
async function publish(){if(!postFile){toast('اختر صورة أولاً');return}let btn=event?.target;try{toast('جاري رفع الصورة...');let image_url=await uploadImage(postFile,'posts'),caption=document.getElementById('caption').value.trim(),category=document.getElementById('postCat').value;let {error}=await sb.from('posts').insert({user_id:me.id,image_url,caption,category});if(error)throw error;toast('تم نشر المنشور');go('feed')}catch(e){toast(e.message)}}
async function like(id,liked){let q=liked?sb.from('likes').delete().eq('post_id',id).eq('user_id',me.id):sb.from('likes').insert({post_id:id,user_id:me.id});let {error}=await q;if(error)toast(error.message);else loadPosts()}
async function comment(e,id){e.preventDefault();let i=document.getElementById('c'+id),text=i.value.trim();if(!text)return;let {error}=await sb.from('comments').insert({post_id:id,user_id:me.id,text});if(error)toast(error.message);else loadPosts()}
async function delPost(id){if(!confirm('حذف المنشور؟'))return;let {error}=await sb.from('posts').delete().eq('id',id).eq('user_id',me.id);if(error)toast(error.message);else loadPosts()}
async function report(id){let reason=prompt('سبب البلاغ؟');if(!reason)return;let {error}=await sb.from('reports').insert({reporter_id:me.id,post_id:id,reason});if(error)toast(error.message);else toast('تم إرسال البلاغ للمراجعة')}
async function profilePage(id){document.getElementById('app').innerHTML='<div class="empty">جاري تحميل الملف...</div>';let {data:p,error}=await sb.from('profiles').select('*').eq('id',id).single();if(error){document.getElementById('app').innerHTML='<div class="empty">المستخدم غير موجود.</div>';return}let [{data:posts},{count:followers},{count:following}]=await Promise.all([sb.from('posts').select('id,image_url,caption,category,created_at').eq('user_id',id).order('created_at',{ascending:false}),sb.from('follows',{count:'exact',head:true}).select('*').eq('following_id',id),sb.from('follows',{count:'exact',head:true}).select('*').eq('follower_id',id)]);let {data:f}=await sb.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();let mine=id===me.id;document.getElementById('app').innerHTML=`<section class="card profile"><div class="profiletop">${avatar(p,true)}<div><div class="pname">${esc(p.username)} ${p.verified?'<span class="verify">✓</span>':''}</div><div class="meta">${esc(p.specialty)}</div><div class="stats"><div class="stat"><b>${posts?.length||0}</b><span>منشورات</span></div><div class="stat"><b>${followers||0}</b><span>متابعين</span></div><div class="stat"><b>${following||0}</b><span>يتابع</span></div></div></div></div><div class="bio">${esc(p.bio||'')}</div><div class="row" style="margin-top:14px">${mine?`<button class="btn secondary" onclick="editProfile()">تعديل الملف</button>`:`<button class="btn ${f?'secondary':''}" onclick="follow('${id}',${!!f})">${f?'متابَع':'متابعة'}</button><button class="btn secondary" onclick="startChat('${id}')">💬 رسالة</button>`}</div></section><h3>منشورات ${esc(p.username)}</h3>${posts?.length?`<div class="grid">${posts.map(x=>`<img src="${esc(x.image_url)}" alt="" onclick="go('post',${x.id})">`).join('')}</div>`:'<div class="empty">لا توجد منشورات.</div>'}`}
function editProfile(){document.getElementById('app').innerHTML=`<section class="card profile"><h2>تعديل الملف الشخصي</h2><div style="display:flex;gap:15px;align-items:center;margin-bottom:15px">${avatar(me,true)}<label class="btn secondary" for="avatarFile">تغيير الصورة</label><input id="avatarFile" class="hidden" type="file" accept="image/*"></div><div class="field"><label>اسم المستخدم</label><input id="euser" value="${esc(me.username)}" disabled></div><div class="field"><label>الاسم الظاهر</label><input id="edisplay" value="${esc(me.display_name)}"></div><div class="field"><label>التخصص</label><select id="especialty">${specialties.map(x=>`<option ${x===me.specialty?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>نبذة</label><textarea id="ebio" maxlength="500">${esc(me.bio||'')}</textarea></div><button class="btn" onclick="saveProfile()">حفظ التغييرات</button> <button class="btn secondary" onclick="go('profile','${me.id}')">إلغاء</button></section>`;document.getElementById('avatarFile').onchange=e=>avatarFile=e.target.files[0]}
async function saveProfile(){try{let avatar_url=me.avatar_url;if(avatarFile){if(avatarFile.size>5*1024*1024)throw new Error('الصورة يجب أن تكون أقل من 5MB');avatar_url=await uploadImage(avatarFile,'avatars')}let updates={display_name:document.getElementById('edisplay').value.trim()||me.username,specialty:document.getElementById('especialty').value,bio:document.getElementById('ebio').value.trim(),avatar_url};let {error}=await sb.from('profiles').update(updates).eq('id',me.id);if(error)throw error;await loadMe();toast('تم تحديث الملف');go('profile',me.id)}catch(e){toast(e.message)}}
async function follow(id,isFollowing){let q=isFollowing?sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id):sb.from('follows').insert({follower_id:me.id,following_id:id});let {error}=await q;if(error)toast(error.message);else profilePage(id)}
async function searchPage(){document.getElementById('app').innerHTML=`<input id="q" placeholder="🔎 ابحث عن مستخدم أو تخصص..." oninput="runSearch()"><div id="results" style="margin-top:12px"></div>`;runSearch()}
async function runSearch(){let q=(document.getElementById('q')?.value||'').trim();let query=sb.from('profiles').select('*').eq('blocked',false).limit(30);if(q)query=query.or(`username.ilike.%${q}%,display_name.ilike.%${q}%,specialty.ilike.%${q}%`);let {data,error}=await query;if(error){document.getElementById('results').innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}document.getElementById('results').innerHTML=data?.length?data.map(u=>`<div class="card result">${avatar(u)}<div class="grow"><div class="user" onclick="go('profile','${u.id}')">${esc(u.username)} ${u.verified?'<span class="verify">✓</span>':''}</div><div class="meta">${esc(u.specialty)}</div></div>${u.id!==me.id?`<button class="btn secondary" onclick="startChat('${u.id}')">رسالة</button>`:''}</div>`).join(''):'<div class="empty">لا توجد نتائج.</div>'}
async function getConv(other){let {data:mine}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);let ids=(mine||[]).map(x=>x.conversation_id);if(!ids.length)return null;let {data:members}=await sb.from('conversation_members').select('conversation_id').in('conversation_id',ids).eq('user_id',other);let cid=members?.[0]?.conversation_id;if(!cid)return null;let {data:c}=await sb.from('conversations').select('*').eq('id',cid).maybeSingle();return c}
async function startChat(other){let c=await getConv(other);if(!c){let {data:n,error}=await sb.from('conversations').insert({}).select().single();if(error){toast(error.message);return}c=n;let {error:e}=await sb.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:other}]);if(e){toast(e.message);return}}go('chat',c.id)}
async function messagesPage(){let {data:cm}=await sb.from('conversation_members').select('conversation_id').eq('user_id',me.id);let ids=(cm||[]).map(x=>x.conversation_id);if(!ids.length){document.getElementById('app').innerHTML='<div class="empty">لا توجد محادثات.<br><br>ابحث عن مستخدم وابدأ محادثة.</div>';return}let {data:cs}=await sb.from('conversations').select('id,created_at,conversation_members(user_id,profiles(username,display_name,avatar_url)),messages(text,created_at,sender_id)').in('id',ids).order('created_at',{ascending:false});document.getElementById('app').innerHTML=`<h2>💬 الرسائل</h2><section class="card">${(cs||[]).map(c=>{let o=c.conversation_members?.find(x=>x.user_id!==me.id)?.profiles,l=(c.messages||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];return `<div class="dm" onclick="go('chat',${c.id})">${avatar(o)}<div class="grow"><div class="user">${esc(o?.username||'User')}</div><div class="meta">${esc(l?.text||'ابدأ المحادثة')}</div></div><div class="meta">${l?ago(l.created_at):''}</div></div>`}).join('')}</section>`}
async function chatPage(id){let {data:c}=await sb.from('conversations').select('id,conversation_members(user_id,profiles(id,username,display_name,avatar_url,specialty)),messages(id,sender_id,text,created_at)').eq('id',id).single();if(!c){go('messages');return}let o=c.conversation_members?.find(x=>x.user_id!==me.id)?.profiles;let msgs=(c.messages||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));document.getElementById('app').innerHTML=`<section class="card chat"><div class="chathead"><button class="btn secondary" onclick="go('messages')">←</button>${avatar(o)}<div><div class="user">${esc(o?.username||'User')}</div><div class="meta">${esc(o?.specialty||'')}</div></div></div><div class="chatbody" id="chatbody">${msgs.length?msgs.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':'theirs'}">${esc(m.text)}<span class="meta" style="display:block;opacity:.65">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<div class="empty">ابدأ المحادثة 👋</div>'}</div><form class="chatform" onsubmit="sendMsg(event,${id})"><input id="msg" maxlength="1000" placeholder="اكتب رسالة..."><button class="btn">إرسال</button></form></section>`;document.getElementById('chatbody').scrollTop=999999}
async function sendMsg(e,id){e.preventDefault();let i=document.getElementById('msg'),text=i.value.trim();if(!text)return;let {error}=await sb.from('messages').insert({conversation_id:id,sender_id:me.id,text});if(error)toast(error.message);else chatPage(id)}
async function notificationsPage(){let {data,error}=await sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(50);document.getElementById('app').innerHTML=`<h2>🔔 التنبيهات</h2><section class="card">${error?`<div class="empty">${esc(error.message)}</div>`:data?.length?data.map(n=>`<div class="notice ${n.is_read?'':'unread'}">${esc(n.text||n.type)}<div class="meta">${ago(n.created_at)}</div></div>`).join(''):'<div class="empty">لا توجد تنبيهات.</div>'}</section>`;if(data?.some(n=>!n.is_read))await sb.from('notifications').update({is_read:true}).eq('user_id',me.id).eq('is_read',false)}
async function postPage(id){let {data:p}=await sb.from('posts').select('id,user_id,image_url,caption,category,created_at,profiles!posts_user_id_fkey(id,username,display_name,avatar_url,verified,blocked),likes(user_id),comments(id,user_id,text,created_at,profiles!comments_user_id_fkey(username))').eq('id',id).single();document.getElementById('app').innerHTML=p?postHTML(p):'<div class="empty">المنشور غير موجود.</div>'}
async function render(){header();if(!me){route==='register'?registerPage():loginPage();return}if(route==='feed')feedPage();else if(route==='create')feedPage();else if(route==='profile')profilePage(param);else if(route==='search')searchPage();else if(route==='messages')messagesPage();else if(route==='chat')chatPage(param);else if(route==='notifications')notificationsPage();else if(route==='post')postPage(param);else feedPage()}
boot();
</script>
</body></html>
